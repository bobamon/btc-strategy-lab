  --border:#DDE3EA; --border-2:#C8D1DC;
  --accent:#2B4C8C; --accent-ink:#FFFFFF; --accent-soft:#E7ECF7;

  --research:#94A2B2; --research-soft:#212B36;
  --rejected:#F87171; --rejected-soft:#331717;
  --pos:#4ADE80; --neg:#F87171;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 72px}

.mast{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.mast h1{
  font-family:Archivo,ui-sans-serif,system-ui,sans-serif;font-weight:700;
  font-size:clamp(24px,3.2vw,33px);letter-spacing:-.02em;margin:0;text-wrap:balance;
}
.mast p{margin:6px 0 0;color:var(--muted);max-width:62ch;font-size:14px}
.stamp{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);border:1px solid var(--border);
  border-radius:999px;padding:5px 11px;white-space:nowrap;
}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;margin-bottom:24px}
.cell{background:var(--surface);padding:13px 15px}
.cell .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}
.cell .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:21px;font-weight:600;margin-top:3px;letter-spacing:-.01em}

.rail{position:sticky;top:0;z-index:20;background:var(--ground);
  padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:4px}
.rail-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.rail-row + .rail-row{margin-top:9px}
.lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  font-weight:600;margin-right:2px}
input[type=search],select,input[type=number]{
  font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);
  border:1px solid var(--border-2);border-radius:7px;padding:7px 10px;min-width:0;
}
input[type=search]{flex:1 1 210px;max-width:320px}
input[type=number]{width:88px;font-family:"IBM Plex Mono",monospace}
select{cursor:pointer}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.chip{
  font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--border-2);
  border-radius:999px;padding:6px 13px;transition:background .12s,border-color .12s,color .12s;
}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sortbtn{
  font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;background:var(--surface);
  color:var(--ink-2);border:1px solid var(--border-2);border-radius:7px;padding:6px 11px;
}
.sortbtn:hover{border-color:var(--accent)}
.sortbtn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sortbtn .dir{font-family:"IBM Plex Mono",monospace;opacity:.75;margin-left:4px}
.ghost{
  font:inherit;font-size:12.5px;cursor:pointer;background:none;border:none;
  color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:6px 4px;
}
.count{margin-left:auto;font-size:12.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace}

.list{display:flex;flex-direction:column;gap:11px;margin-top:18px}
.row{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:5px 1fr}
.stripe{background:var(--research)}
.row[data-status=passed] .stripe{background:var(--pass)}
.row[data-status=testing] .stripe{background:var(--testing)}
.row[data-status=rejected] .stripe{background:var(--rejected)}
.row-in{padding:15px 17px}
.row-head{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin-bottom:3px}
.row-head h2{font-family:Archivo,sans-serif;font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.pill{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.research{background:var(--research-soft);color:var(--research)}
.pill.testing{background:var(--testing-soft);color:var(--testing)}
.pill.passed{background:var(--pass-soft);color:var(--pass)}
.pill.rejected{background:var(--rejected-soft);color:var(--rejected)}
.tag{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:2px 7px}
.desc{color:var(--muted);font-size:13.5px;margin:7px 0 13px;max-width:78ch}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:11px;
  padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.m .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.m .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:17px;font-weight:600;margin-top:2px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.row-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.dates{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);
  display:flex;flex-wrap:wrap;gap:12px}
.acts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;text-decoration:none;
  display:inline-block;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--border-2);border-radius:7px;padding:6px 12px;transition:border-color .12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{color:var(--accent-ink);opacity:.9}

.empty{border:1px dashed var(--border-2);border-radius:var(--r);background:var(--surface);
  padding:34px 30px;text-align:left}
.empty h3{font-family:Archivo,sans-serif;font-size:19px;margin:0 0 8px;font-weight:600}
.empty p{color:var(--muted);margin:0 0 16px;max-width:66ch;font-size:14px}
.empty ol{color:var(--ink-2);margin:0;padding-left:20px;max-width:66ch;font-size:14px}
.empty li{margin-bottom:7px}
.empty code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.gate{margin-top:20px;padding:13px 15px;background:var(--surface-2);
  border-left:3px solid var(--accent);border-radius:0 7px 7px 0;font-size:13.5px;color:var(--ink-2)}
.gate b{color:var(--ink)}

dialog{border:none;border-radius:12px;padding:0;background:var(--surface);color:var(--ink);
  max-width:min(920px,94vw);width:100%;box-shadow:0 12px 48px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(10,14,19,.62)}
.dlg-head{display:flex;gap:12px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--border)}
.dlg-head h3{font-family:Archivo,sans-serif;font-size:16px;margin:0;font-weight:600;flex:1}
.dlg-body{padding:0;max-height:68vh;overflow:auto}
.dlg-body pre{margin:0;padding:18px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  line-height:1.6;white-space:pre;overflow-x:auto;color:var(--ink-2)}
.dlg-body .prose{padding:18px;font-size:14px;color:var(--ink-2)}
.spec-note{margin-top:14px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<div class="wrap">
  <header class="mast">
    <div>
      <h1>Strategy Control Panel</h1>
      <p>Backtested BTCUSDT strategies. Every row is generated from a recorded backtest &mdash; nothing here is estimated.</p>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>

  <section class="strip" id="strip"></section>

  <div class="rail">
    <div class="rail-row">
      <input type="search" id="q" placeholder="Search name or rules&hellip;" aria-label="Search strategies">
      <span class="lbl">Status</span>
      <button class="chip" data-f="status" data-v="passed" aria-pressed="false">Passed</button>
      <button class="chip" data-f="status" data-v="testing" aria-pressed="false">Testing</button>
      <button class="chip" data-f="status" data-v="research" aria-pressed="false">Research</button>
      <button class="chip" data-f="status" data-v="rejected" aria-pressed="false">Rejected</button>
      <span class="count" id="count"></span>
    </div>
    <div class="rail-row">
      <span class="lbl">Symbol</span>
      <select id="sym" aria-label="Filter by symbol"><option value="">All</option></select>
      <span class="lbl">TF</span>
      <select id="tf" aria-label="Filter by timeframe"><option value="">All</option></select>
      <span class="lbl">Side</span>
      <select id="dir" aria-label="Filter by direction"><option value="">All</option></select>
      <span class="lbl">Min trades</span><input type="number" id="minT" min="0" step="10" placeholder="0">
      <span class="lbl">Min PF</span><input type="number" id="minPF" min="0" step="0.1" placeholder="0">
      <span class="lbl">Max DD%</span><input type="number" id="maxDD" min="0" step="1" placeholder="100">
      <button class="ghost" id="reset">Reset</button>
    </div>
    <div class="rail-row">
      <span class="lbl">Sort</span>
      <button class="sortbtn" data-s="profitFactor" aria-pressed="true">Profit factor<span class="dir">&darr;</span></button>
      <button class="sortbtn" data-s="netProfitPct" aria-pressed="false">Return<span class="dir"></span></button>
      <button class="sortbtn" data-s="maxDrawdownPct" aria-pressed="false">Max DD<span class="dir"></span></button>
      <button class="sortbtn" data-s="totalTrades" aria-pressed="false">Trades<span class="dir"></span></button>
      <button class="sortbtn" data-s="winRatePct" aria-pressed="false">Win rate<span class="dir"></span></button>
      <button class="sortbtn" data-s="lastTestedDate" aria-pressed="false">Last tested<span class="dir"></span></button>
    </div>
  </div>

  <div class="list" id="list"></div>
</div>

<dialog id="dlg">
  <div class="dlg-head">
    <h3 id="dlgTitle"></h3>
    <button class="btn" id="dlgCopy" hidden>Copy</button>
    <button class="btn" id="dlgClose">Close</button>
  </div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

    "pineSource": "//@version=6\n// BTC ATTACK 48 — ROUND-NUMBER MAGNET (MOMENTUM CONTINUATION THROUGH A PSYCHOLOGICAL LEVEL, BARE).\n// Continues numbering after Attack 47 (rejected on sample -- 24 trades, direction only). Queue item 1\n// (Attack 37's filter stack) is EXHAUSTED per the docs: Attack 41 closed Attack 37, Attack 43 closed\n// the whole sweep-reversal family, and Attack 47 -- the first filter attempted on the CURRENT champion,\n// Attack 46 -- died on the identical ~77% sample wall HARD LESSON 49 already named across two labs.\n// The board's own queue says \"stop adding filters on this data\" and ranks an out-of-sample test above\n// everything else, but that test needs another symbol or another data source and this lab is\n// BTCUSDT-only -- a constraint to report, not engineer around. So this cycle proposes ONE genuinely\n// new mechanism, per the mandate's own fallback.\n//\n// CLAIM: a decisive close through a major psychological round-number price level ($1,000-scale bands,\n// rescaled by an order of magnitude as BTC's price rises) tends to CONTINUE toward the next round\n// number rather than reverting immediately, because resting stop and limit orders cluster at round\n// numbers (a documented microstructure effect in FX and crypto), and clearing that cluster removes\n// nearby resistance to further movement in the same direction.\n//\n// GENUINELY DISTINCT from every mechanism already tried:\n//   - VWAP pullback-continuation family (RETIRED) -- an intraday MEAN, not a round-number grid.\n//   - Attack 33 channel breakout -- a rolling N-bar extreme, not a fixed psychological price grid.\n//   - Attack 34/35 weekly break-and-hold -- a CALENDAR anchor (Monday's range), not price-derived at all.\n//   - Attack 36 narrow-range day expansion -- a VOLATILITY-STATE gate (a coil), no level of any kind.\n//   - Attack 37/38/39/40/41/43 liquidity sweep reversal -- a FAILED break of a swing low that reverses;\n//     this trades WITH a level break that % equity are untestable in this lab\n//                            (HARD LESSON 34/35/50: the engine sheds margin slivers that corrupt\n//                            trade-level stats on the loss side). A short mirror (crossing DOWN through\n//                            a round number, continuation lower) is a separate, un-coded construction.\n//   BINDING (E17)          -- crossedUp requires the bar's close to land in a HIGHER round-number band\n//                            than the previous bar's close. Ordinary bars do not change bands; the\n//                            binding evidence is the trade count, reported before any ratio is read.\n//   REDUNDANCY (E14)       -- two independent terms: crossedUp is a DIRECTIONAL/structural condition\n//                            (which band the close falls in, relative to the prior bar), rBig is a\n//                            MAGNITUDE condition (is the resulting stop distance big enough). Neither\n//                            implies the other -- a level crossing can happen on a tiny-range bar (fails\n//                            rBig) or a huge-range bar (passes it easily).\n//   LATCH IN SEQUENCE (LESSON 8) -- levelPrev is derived from close[1], levelCur from the current bar's\n//                            close; the comparison spans two bars exactly like Attack 37's swingLow[1]\n//                            and Attack 44's sup[1]/res[1], a pattern already proven not to zero out in\n//                            this engine. Setup (below the band) and trigger (closed into it) cannot\n//                            share the bar that established the reference level.\n//   SL and TP FIXED AT ENTRY. No trailing, no averaging down, no martingale.\n//\n// OUTCOMES REGISTERED BEFORE THE RUN (LESSON 17):\n//   * PRE-2024 HALF BELOW 1.0 -> DISCARD outright, per the kill rule. No filters, no rescue, H2 not run.\n//   * BOTH HALVES >= 1.0 AND ratioAvgWinLoss well above 1 with avgBarsWinning a small fraction of\n//     maxBars -> the round-number magnet is real and resolves quickly, matching the reachable-target\n//     principle that already worked for Attack 44-46 (HARD LESSON 41/47), applied to a genuinely new\n//     level source. This ADVANCES as the lab's newest discovery-track candidate.\n//   * BOTH HALVES >= 1.0 BUT avgBarsWinning near the 192-bar cap -> the target is being reached only by\n//     truncation (HARD LESSON 38/39), not because the magnet claim is true; report it as such.\n//   * PROFIT FACTOR CLEARS 1.0 BUT AVG LOSER IS LARGE RELATIVE TO EQUITY -> drawdown category 1\n//     (concentrated, a sizing problem); AVG LOSER SMALL BUT WIN RATE LOW AND DRAWDOWN STILL DEEP ->\n//     category 2 or 3 per the board's own taxonomy -- report avg loser, win rate and max drawdown\n//     together regardless of which category applies.\n//   * FEWER THAN ~30 TRADES ON EITHER HALF -> the ratio is a DIRECTION, not a result (LESSON 12).\n//   * TRADE COUNT FAR OUTSIDE THE ~60-350 WORKABLE BAND (Attack 33/34/37) -> report against that band\n//     for context; a step this coarse (adaptive $1,000-$10,000 bands) may fire far less often than the\n//     swing-based families, and that is a finding, not a failure by itself.\n//   * REPORT GROSS, COMMISSION AND ACHIEVED WIN/LOSS RATIO ALONGSIDE NET -- required since LESSONS 36/39.\nstrategy(\"BTC Attack48 round-number magnet\", overlay=true,\n     pyramiding=1, process_orders_on_close=true,\n     commission_type=strategy.commission.percent, commission_value=0.05,\n     initial_capital=10000,\n     default_qty_type=strategy.percent_of_equity, default_qty_value=100,\n     margin_long=100, margin_short=100)\n\nminRpct = input.float(0.80, \"Min stop distance as % of price (LESSON 3)\")\nmaxBars = input.int(192,    \"Max bars in trade -- 2 days on 15m\")\n\nstep      = math.pow(10, math.floor(math.log(close) / math.log(10)) - 1)\nlevelPrev = math.floor(close[1] / step) * step\nlevelCur  = math.floor(close    / step) * step\ncrossedUp = levelCur > levelPrev\n\ntarget = levelCur + step\nslPx0  = low\nrLong  = close - slPx0\nminR   = close * minRpct / 100\nrBig   = rLong >= minR\n\ngoLong = crossedUp and rBig and rLong > 0 and target > close\n\nvar float slPx   = na\nvar float tpPx   = na\nvar int   barsIn = 0\n\nflat = strategy.position_size == 0\n\nif flat and goLong\n    strategy.entry(\"L\", strategy.long)\n    slPx   := slPx0\n    tpPx   := target\n    barsIn := 0\n\nif strategy.position_size > 0\n    strategy.exit(\"LX\", from_entry=\"L\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\n\nif barsIn >= maxBars and strategy.position_size != 0\n    strategy.close_all()\n    barsIn := 0\n\nplot(goLong ? 1 : 0, title=\"LongSignal\")\nplot(levelCur, title=\"RoundLevel\")\nplot(target,   title=\"TargetLevel\")\n"

    "pineSource": "//@version=6\n// BTC ATTACK 49 - IMPULSE-BAR MOMENTUM CONTINUATION. A GENUINELY NEW MECHANISM.\n//\n// THE STORED PROMPT asks for Attack 37's filter stack. THE DOCS OVERRIDE IT A THIRD TIME: Attack 41\n// closed Attack 37 as a development target, Attack 43 closed the whole sweep-reversal family, and\n// Attack 47 -- the one filter tried on the CURRENT champion, Attack 46 -- died on the ~77% sample\n// wall HARD LESSON 49 named across two labs (v56/v57 in 3M, Attack 47 here). The board's own queue\n// says stop adding filters to Attack 46 on this data, so this cycle uses the mandate's fallback:\n// one genuinely new mechanism, bare, split-tested on both halves before any tuning.\n//\n// ==================== THE CLAIM, ONE SENTENCE ====================\n// A single bar whose true range is a large multiple of recent average range, closing near its own\n// extreme with volume well above its recent average, marks an aggressive directional push by\n// participants transacting at a worse price to get filled NOW; price tends to continue by roughly\n// its own range again before the push exhausts.\n//\n// ==================== GENUINELY DISTINCT FROM EVERY FAMILY ON THIS BOARD ====================\n// VWAP pullback-continuation (retired): required a stretch-then-reclaim of a moving reference. This\n//   mechanism has no VWAP term and no reclaim -- it trades WITH the bar that just printed, not off a\n//   return to a mean.\n// Attack 33 channel breakout: a rolling N-bar HIGH/LOW crossing. This has no channel; a single bar's\n//   OWN range against its OWN recent ATR is the entire signal, independent of where price sits\n//   relative to any lookback high or low.\n// Attack 34/35 weekly break-and-hold: a calendar anchor (prior completed week). No calendar term here.\n// Attack 36 narrow-range day expansion: required LOW volatility beforehand, then a break of that\n//   compression. This mechanism requires the OPPOSITE precondition -- nothing about prior compression\n//   is tested or needed; a large bar after an already-volatile stretch qualifies exactly as well as\n//   one after a quiet one.\n// Attack 37-43 liquidity sweep reversal: a FAILED break below a swing low that recovers -- trades\n//   AGAINST the immediately preceding move. This trades WITH the immediately preceding bar's own\n//   direction. Opposite polarity, opposite claim.\n// Attack 44-47 level-target support-hold: a two-moment setup (tap a prior swing low, then close back\n//   above it) targeting a prior swing high. This is a ONE-bar pattern with no swing lookback anywhere\n//   in the entry, and its target is sourced from the signal bar's OWN range, not a prior structural\n//   level.\n// Attack 48 round-number magnet: a fixed psychological price grid, level-agnostic to any bar's own\n//   statistics. This mechanism has no grid and no fixed price levels at all -- everything is relative\n//   to the bar's own range, its own recent ATR, and its own recent volume.\n//\n// ==================== DESIGN ====================\n// ENTRY (all four terms true on the SAME bar -- this is a one-bar pattern, not a setup+trigger pair,\n//   so LESSON 8's \"different bars\" requirement does not apply here; flagged explicitly rather than\n//   silently skipped):\n//   1. isImpulse   -- (high-low) >= atrMult * ATR14, ATR measured over the PRIOR 14 bars (shifted [1]\n//                     so the huge bar cannot inflate the very baseline it is being measured against).\n//   2. isBullish   -- close > open (this is the long leg only, see LESSON 6 below).\n//   3. closeNearHigh -- close sits in the top (1-closeLoc) of the bar's own range, i.e. the push did\n//                     not fail into the close.\n//   4. volConfirm  -- volume >= volMult * the PRIOR 20-bar average volume (again [1]-shifted, same\n//                     reasoning as term 1).\n// STOP  -- the impulse bar's own low (LESSON 5: the actual extreme of the push just witnessed, not an\n//   ATR distance or a percentage).\n// TARGET -- close + rewardMult * (the impulse bar's own range). A measured-move target sourced from\n//   this signal's own magnitude -- a NEW level source, applying the reachable-target principle\n//   validated by HARD LESSON 41/47 to a mechanism that has never used it before.\n// R FLOOR -- LESSON 3: reward is only taken if the stop distance clears 0.8% of price, enforced by\n//   EXCLUDING the setup, never by widening the stop.\n//\n// AUDIT, one line per leg:\n//   R >= 0.8% (LESSON 3) - rBig is an EXCLUSION (skip the setup), never a clamp on slPx.\n//   Stop beyond STRUCTURE (LESSON 5) - slPx = the impulse bar's own low, the real extreme of the bar\n//        being traded, not derived from ATR or a fixed percentage.\n//   Each leg separately (LESSON 6) - LONG ONLY this cycle. The mirror short (bearish impulse bar,\n//        close near the low, target below) is NOT built here -- CREDITS: only two runs are budgeted\n//        this cycle (H1 kill-gate, then H2), so testing a second, independently-built leg is out of\n//        scope, not assumed to work. Recorded as outstanding, per the standing bidirectional\n//        requirement.\n//   BINDING (E17) - all four terms are expected to bind materially: isImpulse alone should be rare\n//        (large bars are a minority by construction), and closeNearHigh + volConfirm further cut\n//        whatever isImpulse admits. Trade count is read first, before any ratio, to confirm this\n//        rather than assume it.\n//   REDUNDANCY (E14) - isImpulse (range magnitude) and closeNearHigh (WHERE in that range the bar\n//        closed) are independent axes: a bar can be huge and close in the middle (indecision, a\n//        failed push) or huge and close at the extreme (conviction). volConfirm (participation) is\n//        independent of both -- a large, well-placed bar on thin volume is a different claim than one\n//        on heavy volume, so none of the four terms is restating another.\n//   LATCH IN SEQUENCE (LESSON 8) - N/A by design, stated explicitly above: this is a single-bar\n//        pattern, so setup and trigger necessarily share one bar. The averages the bar is measured\n//        AGAINST (ATR14, 20-bar volume) are [1]-shifted so the threshold itself is prior information;\n//        only the classification of the current bar uses the current bar.\n//   OCCUPANCY (LESSONS 24/28/29) - pyramiding=1, flat-check before entry, one position at a time.\n//   CASCADE (HARD LESSON 35) - long build, expect cascadeRatio 1; verify before applying clause 3.\n//   SL and TP FIXED AT ENTRY. No trailing, no averaging down, no martingale.\n//\n// OUTCOMES REGISTERED BEFORE THE RUN (LESSON 17):\n//   * BOTH HALVES ABOVE 1.0, roughly 60-350 trades per half (the lab's settled workable band) ->\n//     ADVANCES. A genuinely new, uncorrelated mechanism next to Attack 46, worth a filter-stack queue\n//     item of its own once cold-reproduced.\n//   * H1 BELOW 1.0 -> KILL RULE: DISCARD immediately, H2 not run, second credit not spent. No filters\n//     to rescue it (per the mandate's explicit instruction).\n//   * H1 ABOVE 1.0 BUT H2 BELOW -> the classic sign this lab has seen repeatedly (VWAP family,\n//     Attacks 38-40): an edge that does not survive into the recent regime. Recorded as a real\n//     finding, not discarded outright, but not advanced either.\n//   * FEWER THAN ~30 TRADES IN EITHER HALF -> a DIRECTION, not a result (LESSON 12); PF not quoted\n//     as a ratio.\n//   * LARGE SHARE OF EXITS AT maxBars -> the cap is truncating winners before the measured-move\n//     target is reached (HARD LESSON 38); report avgBarsWinning against the cap before drawing any\n//     conclusion about the target's reachability.\n//   REPORT GROSS, COMMISSION, ACHIEVED RATIO, AVG LOSER AND WIN RATE alongside PF and drawdown\n//   (LESSONS 36/39 and the board's standing drawdown-taxonomy instruction).\nstrategy(\"BTC Attack49 impulse-bar continuation\", overlay=true,\n     pyramiding=1, process_orders_on_close=true,\n     commission_type=strategy.commission.percent, commission_value=0.05,\n     initial_capital=10000,\n     default_qty_type=strategy.percent_of_equity, default_qty_value=100,\n     margin_long=100, margin_short=100)\n\natrLen    = input.int(14,    \"ATR lookback for the impulse threshold\")\natrMult   = input.float(2.0, \"Impulse threshold -- bar range as a multiple of prior ATR\")\ncloseLoc  = input.float(0.75,\"Min close position in the bar's own range (0-1, near the high)\")\nvolLen    = input.int(20,    \"Volume average lookback\")\nvolMult   = input.float(1.5, \"Volume confirmation -- multiple of the prior volume average\")\nminRpct   = input.float(0.80,\"Min stop distance as % of price (LESSON 3)\")\nrewardMult= input.float(2.0, \"Target -- multiple of the impulse bar's own range, projected from close\")\nmaxBars   = input.int(192,   \"Max bars in trade\")\n\nrng       = high - low\npriorAtr  = ta.atr(atrLen)[1]\npriorVol  = ta.sma(volume, volLen)[1]\n\nisImpulse    = rng > 0 and not na(priorAtr) and rng >= atrMult * priorAtr\nisBullish    = close > open\nclosePos     = rng > 0 ? (close - low) / rng : 0.0\ncloseNearHigh= closePos >= closeLoc\nvolConfirm   = not na(priorVol) and volume >= volMult * priorVol\n\nrLong = close - low\nminR  = close * minRpct / 100\nrBig  = rLong >= minR\n\ngoLong = isImpulse and isBullish and closeNearHigh and volConfirm and rBig\n\nvar float slPx   = na\nvar float tpPx   = na\nvar int   barsIn = 0\n\nflat = strategy.position_size == 0\n\nif flat and goLong\n    strategy.entry(\"L\", strategy.long)\n    slPx   := low\n    tpPx   := close + rewardMult * rng\n    barsIn := 0\n\nif strategy.position_size > 0\n    strategy.exit(\"LX\", from_entry=\"L\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\n\nif barsIn >= maxBars and strategy.position_size != 0\n    strategy.close_all()\n    barsIn := 0\n\nplot(goLong ? 1 : 0, title=\"LongSignal\")\nplot(slPx, title=\"StopLevel\")\nplot(tpPx, title=\"TargetLevel\")\n",

const BUILT = "2026-09-05 02:14";

const $ = (s) => document.querySelector(s);
const list = $('#list');
$('#stamp').textContent = DATA.length
  ? DATA.length + ' backtested · built ' + BUILT
  : 'No backtests yet · built ' + BUILT;

const state = {
  q:'', status:new Set(), sym:'', tf:'', dir:'',
  minT:null, minPF:null, maxDD:null, sort:'profitFactor', desc:true
};
// Drawdown is the one axis where lower is better, so it defaults to ascending.
const ASC_IS_BETTER = new Set(['maxDrawdownPct']);

const ENT = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ENT[c]);
const n1 = (v) => v.toFixed(1);
const n2 = (v) => v.toFixed(2);
const sign = (v) => (v > 0 ? '+' : '') + n1(v) + '%';

function fillSelect(el, vals){
  vals.forEach((v) => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v; el.appendChild(o);
  });
}
fillSelect($('#sym'), [...new Set(DATA.map((d) => d.symbol))].sort());
fillSelect($('#tf'),  [...new Set(DATA.map((d) => d.timeframe))].sort());
fillSelect($('#dir'), [...new Set(DATA.map((d) => d.direction))].sort());

function summary(rows){
  let cells;
  if (!DATA.length){
    cells = [['Strategies backtested','0'],['Passed','0'],['Best profit factor','—'],
             ['Lowest max DD','—'],['Total trades','—']];
  } else {
    const pf = rows.map((r) => r.metrics.profitFactor);
    const dd = rows.map((r) => r.metrics.maxDrawdownPct);
    cells = [
      ['Strategies backtested', String(DATA.length)],
      ['Passed', String(DATA.filter((r) => r.status === 'passed').length)],
      ['Best profit factor', pf.length ? n2(Math.max.apply(null, pf)) : '—'],
      ['Lowest max DD', dd.length ? n1(Math.min.apply(null, dd)) + '%' : '—'],
      ['Total trades', String(rows.reduce((a, r) => a + r.metrics.totalTrades, 0))]
    ];
  }
  $('#strip').innerHTML = cells.map(
    (c) => '<div class="cell"><div class="k">' + esc(c[0]) + '</div><div class="v">' + esc(c[1]) + '</div></div>'
  ).join('');
}

function apply(){
  const rows = DATA.filter((r) => {
    if (state.status.size && !state.status.has(r.status)) return false;
    if (state.sym && r.symbol !== state.sym) return false;
    if (state.tf && r.timeframe !== state.tf) return false;
    if (state.dir && r.direction !== state.dir) return false;
    if (state.minT !== null && r.metrics.totalTrades < state.minT) return false;
    if (state.minPF !== null && r.metrics.profitFactor < state.minPF) return false;
    if (state.maxDD !== null && r.metrics.maxDrawdownPct > state.maxDD) return false;
    if (state.q){
      const hay = (r.name + ' ' + r.description + ' ' + r.symbol).toLowerCase();
      if (hay.indexOf(state.q.toLowerCase()) === -1) return false;
    }
    return true;
  });
  const k = state.sort;
  rows.sort((a, b) => {
    const av = k === 'lastTestedDate' ? a[k] : a.metrics[k];
    const bv = k === 'lastTestedDate' ? b[k] : b.metrics[k];
    const c = av < bv ? -1 : av > bv ? 1 : 0;
    return state.desc ? -c : c;
  });
  summary(rows);
  $('#count').textContent = DATA.length ? rows.length + ' of ' + DATA.length : '';
  render(rows);
}

function metric(k, v, cls){
  return '<div class="m"><div class="k">' + k + '</div><div class="v ' + (cls || '') + '">' + v + '</div></div>';
}

function render(rows){
  if (!DATA.length){ list.innerHTML = emptyState(); return; }
  if (!rows.length){
    list.innerHTML = '<div class="empty"><h3>No strategies match these filters</h3>' +
      '<p>Loosen a threshold or clear the filters to see the full set.</p></div>';
    return;
  }
  list.innerHTML = rows.map((r) => {
    const m = r.metrics;
    const full = (r.provenance && r.provenance.backtestUrl)
      ? '<a class="btn primary" href="' + esc(r.provenance.backtestUrl) + '" target="_blank" rel="noopener">Full backtest</a>'
      : '<button class="btn primary" disabled>Full backtest</button>';
    return '<article class="row" data-status="' + esc(r.status) + '"><div class="stripe"></div><div class="row-in">' +
      '<div class="row-head"><h2>' + esc(r.name) + '</h2>' +
        '<span class="pill ' + esc(r.status) + '">' + esc(r.status) + '</span>' +
        '<span class="tag">' + esc(r.symbol) + '</span>' +
        '<span class="tag">' + esc(r.timeframe) + '</span>' +
        '<span class="tag">' + esc(r.direction) + '</span></div>' +
      '<p class="desc">' + esc(r.description) + '</p>' +
      '<div class="metrics">' +
        metric('Net return', sign(m.netProfitPct), m.netProfitPct >= 0 ? 'pos' : 'neg') +
        metric('Profit factor', n2(m.profitFactor), m.profitFactor >= 1 ? 'pos' : 'neg') +
        metric('Max drawdown', n1(m.maxDrawdownPct) + '%') +
        metric('Trades', String(m.totalTrades)) +
        metric('Win rate', n1(m.winRatePct) + '%') +
        metric('Avg trade', sign(m.avgTradePct), m.avgTradePct >= 0 ? 'pos' : 'neg') +
      '</div>' +
      '<div class="row-foot"><div class="dates">' +
        '<span>Tested ' + esc(r.backtestStart) + ' → ' + esc(r.backtestEnd) + '</span>' +
        '<span>Created ' + esc(r.createdDate) + '</span>' +
        '<span>Last tested ' + esc(r.lastTestedDate) + '</span></div>' +
      '<div class="acts">' +
        '<button class="btn" data-act="rules" data-id="' + esc(r.id) + '">Rules</button>' +
        '<button class="btn" data-act="pine" data-id="' + esc(r.id) + '"' + (r.pineSource ? '' : ' disabled') + '>Pine script</button>' +
        full +
      '</div></div></div></article>';
  }).join('');
}

function emptyState(){
  return '<div class="empty">' +
    '<h3>Nothing has been backtested yet</h3>' +
    '<p>This panel only ever shows strategies with a recorded backtest behind them. Specifications that ' +
    'have not been run do not appear here.</p>' +
    '<ol>' +
      '<li>Code the strategy as Pine v6 and run a real backtest.</li>' +
      '<li>Read the metrics off the returned report.</li>' +
      '<li>Append a record to <code>results/backtests.json</code>.</li>' +
      '<li>Run <code>python build_dashboard.py</code>.</li>' +
      '<li>Republish <code>dashboard/dashboard.html</code> to this same URL.</li>' +
    '</ol>' +
    '<div class="gate"><b>Build-time gate.</b> The generator rejects any record without a ' +
    '<code>provenance</code> block naming a real backtest job or report URL, and any record whose trade ' +
    'count is zero. Estimated or invented numbers cannot reach this page &mdash; the build fails instead.</div>' +
  '</div>';
}

$('#q').addEventListener('input', (e) => { state.q = e.target.value.trim(); apply(); });

document.querySelectorAll('.chip').forEach((b) => {
  b.addEventListener('click', () => {
    const v = b.dataset.v;
    const on = b.getAttribute('aria-pressed') === 'true';
    b.setAttribute('aria-pressed', String(!on));
    if (on) state.status.delete(v); else state.status.add(v);
    apply();
  });
});

function bindSel(id, key){
  $(id).addEventListener('change', (e) => { state[key] = e.target.value; apply(); });
}
bindSel('#sym','sym'); bindSel('#tf','tf'); bindSel('#dir','dir');

function bindNum(id, key){
  $(id).addEventListener('input', (e) => {
    const v = e.target.value;
    state[key] = v === '' ? null : Number(v);
    apply();
  });
}
bindNum('#minT','minT'); bindNum('#minPF','minPF'); bindNum('#maxDD','maxDD');

document.querySelectorAll('.sortbtn').forEach((b) => {
  b.addEventListener('click', () => {
    const s = b.dataset.s;
    if (state.sort === s){ state.desc = !state.desc; }
    else { state.sort = s; state.desc = !ASC_IS_BETTER.has(s); }
    document.querySelectorAll('.sortbtn').forEach((o) => {
      const active = o.dataset.s === state.sort;
      o.setAttribute('aria-pressed', String(active));
      o.querySelector('.dir').textContent = active ? (state.desc ? '↓' : '↑') : '';
    });
    apply();
  });
});

$('#reset').addEventListener('click', () => {
  state.q = ''; state.sym = ''; state.tf = ''; state.dir = '';
  state.minT = null; state.minPF = null; state.maxDD = null;
  state.status.clear();
  $('#q').value = ''; $('#sym').value = ''; $('#tf').value = ''; $('#dir').value = '';
  $('#minT').value = ''; $('#minPF').value = ''; $('#maxDD').value = '';
  document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed','false'));
  apply();
});

const dlg = $('#dlg');
const dlgBody = $('#dlgBody');
const dlgTitle = $('#dlgTitle');
const dlgCopy = $('#dlgCopy');
let copyText = '';

list.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const r = DATA.filter((x) => x.id === b.dataset.id)[0];
  if (!r) return;
  if (b.dataset.act === 'pine'){
    dlgTitle.textContent = r.name + ' — Pine v6';
    dlgBody.innerHTML = '<pre>' + esc(r.pineSource) + '</pre>';
    copyText = r.pineSource;
    dlgCopy.hidden = false;
    dlgCopy.textContent = 'Copy';
  } else {
    dlgTitle.textContent = r.name + ' — rules';
    dlgBody.innerHTML = '<div class="prose">' + esc(r.description) +
      (r.specPath ? '<p class="spec-note">Full spec: <code>' + esc(r.specPath) + '</code></p>' : '') +
      (r.notes ? '<p class="spec-note">' + esc(r.notes) + '</p>' : '') + '</div>';
    dlgCopy.hidden = true;
  }
  dlg.showModal();
});

dlgCopy.addEventListener('click', () => {
  navigator.clipboard.writeText(copyText).then(
    () => { dlgCopy.textContent = 'Copied'; },
    () => { dlgCopy.textContent = 'Press Ctrl+C'; }
  );
});
$('#dlgClose').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });

apply();
</script>
