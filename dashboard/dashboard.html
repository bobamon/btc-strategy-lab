<title>Strategy Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F6F7F9; --surface:#FFFFFF; --surface-2:#EFF2F6; --surface-3:#E4E9F0;
  --ink:#141A22; --ink-2:#3A4756; --muted:#5D6B7A; --faint:#8996A5;
  --border:#DDE3EA; --border-2:#C8D1DC;
  --accent:#2B4C8C; --accent-ink:#FFFFFF; --accent-soft:#E7ECF7;
  --pass:#15803D; --pass-soft:#E3F3E9;
  --testing:#B45309; --testing-soft:#FAEEE0;
  --research:#64748B; --research-soft:#EDF0F4;
  --rejected:#B91C1C; --rejected-soft:#FBE9E9;
  --pos:#15803D; --neg:#B91C1C;
  --shadow:0 1px 2px rgba(20,26,34,.06),0 4px 12px rgba(20,26,34,.05);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1319; --surface:#161D26; --surface-2:#1D2732; --surface-3:#26323F;
    --ink:#E8EDF3; --ink-2:#C2CCD8; --muted:#94A2B2; --faint:#6E7D8D;
    --border:#28323E; --border-2:#384553;
    --accent:#7CA0E0; --accent-ink:#0E1319; --accent-soft:#1B2740;
    --pass:#4ADE80; --pass-soft:#14301F;
    --testing:#FBBF24; --testing-soft:#33260C;
    --research:#94A2B2; --research-soft:#212B36;
    --rejected:#F87171; --rejected-soft:#331717;
    --pos:#4ADE80; --neg:#F87171;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1319; --surface:#161D26; --surface-2:#1D2732; --surface-3:#26323F;
  --ink:#E8EDF3; --ink-2:#C2CCD8; --muted:#94A2B2; --faint:#6E7D8D;
  --border:#28323E; --border-2:#384553;
  --accent:#7CA0E0; --accent-ink:#0E1319; --accent-soft:#1B2740;
  --pass:#4ADE80; --pass-soft:#14301F;
  --testing:#FBBF24; --testing-soft:#33260C;
  --research:#94A2B2; --research-soft:#212B36;
  --rejected:#F87171; --rejected-soft:#331717;
  --pos:#4ADE80; --neg:#F87171;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 72px}

.mast{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.mast h1{
  font-family:Archivo,ui-sans-serif,system-ui,sans-serif;font-weight:700;
  font-size:clamp(24px,3.2vw,33px);letter-spacing:-.02em;margin:0;text-wrap:balance;
}
.mast p{margin:6px 0 0;color:var(--muted);max-width:62ch;font-size:14px}
.stamp{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);border:1px solid var(--border);
  border-radius:999px;padding:5px 11px;white-space:nowrap;
}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;margin-bottom:24px}
.cell{background:var(--surface);padding:13px 15px}
.cell .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}
.cell .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:21px;font-weight:600;margin-top:3px;letter-spacing:-.01em}

.rail{position:sticky;top:0;z-index:20;background:var(--ground);
  padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:4px}
.rail-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.rail-row + .rail-row{margin-top:9px}
.lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  font-weight:600;margin-right:2px}
input[type=search],select,input[type=number]{
  font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);
  border:1px solid var(--border-2);border-radius:7px;padding:7px 10px;min-width:0;
}
input[type=search]{flex:1 1 210px;max-width:320px}
input[type=number]{width:88px;font-family:"IBM Plex Mono",monospace}
select{cursor:pointer}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.chip{
  font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--border-2);
  border-radius:999px;padding:6px 13px;transition:background .12s,border-color .12s,color .12s;
}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sortbtn{
  font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;background:var(--surface);
  color:var(--ink-2);border:1px solid var(--border-2);border-radius:7px;padding:6px 11px;
}
.sortbtn:hover{border-color:var(--accent)}
.sortbtn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sortbtn .dir{font-family:"IBM Plex Mono",monospace;opacity:.75;margin-left:4px}
.ghost{
  font:inherit;font-size:12.5px;cursor:pointer;background:none;border:none;
  color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:6px 4px;
}
.count{margin-left:auto;font-size:12.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace}

.list{display:flex;flex-direction:column;gap:11px;margin-top:18px}
.row{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:5px 1fr}
.stripe{background:var(--research)}
.row[data-status=passed] .stripe{background:var(--pass)}
.row[data-status=testing] .stripe{background:var(--testing)}
.row[data-status=rejected] .stripe{background:var(--rejected)}
.row-in{padding:15px 17px}
.row-head{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin-bottom:3px}
.row-head h2{font-family:Archivo,sans-serif;font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.pill{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.research{background:var(--research-soft);color:var(--research)}
.pill.testing{background:var(--testing-soft);color:var(--testing)}
.pill.passed{background:var(--pass-soft);color:var(--pass)}
.pill.rejected{background:var(--rejected-soft);color:var(--rejected)}
.tag{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:2px 7px}
.desc{color:var(--muted);font-size:13.5px;margin:7px 0 13px;max-width:78ch}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:11px;
  padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.m .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.m .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:17px;font-weight:600;margin-top:2px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.row-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.dates{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);
  display:flex;flex-wrap:wrap;gap:12px}
.acts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;text-decoration:none;
  display:inline-block;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--border-2);border-radius:7px;padding:6px 12px;transition:border-color .12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{color:var(--accent-ink);opacity:.9}

.empty{border:1px dashed var(--border-2);border-radius:var(--r);background:var(--surface);
  padding:34px 30px;text-align:left}
.empty h3{font-family:Archivo,sans-serif;font-size:19px;margin:0 0 8px;font-weight:600}
.empty p{color:var(--muted);margin:0 0 16px;max-width:66ch;font-size:14px}
.empty ol{color:var(--ink-2);margin:0;padding-left:20px;max-width:66ch;font-size:14px}
.empty li{margin-bottom:7px}
.empty code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.gate{margin-top:20px;padding:13px 15px;background:var(--surface-2);
  border-left:3px solid var(--accent);border-radius:0 7px 7px 0;font-size:13.5px;color:var(--ink-2)}
.gate b{color:var(--ink)}

dialog{border:none;border-radius:12px;padding:0;background:var(--surface);color:var(--ink);
  max-width:min(920px,94vw);width:100%;box-shadow:0 12px 48px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(10,14,19,.62)}
.dlg-head{display:flex;gap:12px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--border)}
.dlg-head h3{font-family:Archivo,sans-serif;font-size:16px;margin:0;font-weight:600;flex:1}
.dlg-body{padding:0;max-height:68vh;overflow:auto}
.dlg-body pre{margin:0;padding:18px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  line-height:1.6;white-space:pre;overflow-x:auto;color:var(--ink-2)}
.dlg-body .prose{padding:18px;font-size:14px;color:var(--ink-2)}
.spec-note{margin-top:14px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<div class="wrap">
  <header class="mast">
    <div>
      <h1>Strategy Control Panel</h1>
      <p>Backtested BTCUSDT strategies. Every row is generated from a recorded backtest &mdash; nothing here is estimated.</p>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>

  <section class="strip" id="strip"></section>

  <div class="rail">
    <div class="rail-row">
      <input type="search" id="q" placeholder="Search name or rules&hellip;" aria-label="Search strategies">
      <span class="lbl">Status</span>
      <button class="chip" data-f="status" data-v="passed" aria-pressed="false">Passed</button>
      <button class="chip" data-f="status" data-v="testing" aria-pressed="false">Testing</button>
      <button class="chip" data-f="status" data-v="research" aria-pressed="false">Research</button>
      <button class="chip" data-f="status" data-v="rejected" aria-pressed="false">Rejected</button>
      <span class="count" id="count"></span>
    </div>
    <div class="rail-row">
      <span class="lbl">Symbol</span>
      <select id="sym" aria-label="Filter by symbol"><option value="">All</option></select>
      <span class="lbl">TF</span>
      <select id="tf" aria-label="Filter by timeframe"><option value="">All</option></select>
      <span class="lbl">Side</span>
      <select id="dir" aria-label="Filter by direction"><option value="">All</option></select>
      <span class="lbl">Min trades</span><input type="number" id="minT" min="0" step="10" placeholder="0">
      <span class="lbl">Min PF</span><input type="number" id="minPF" min="0" step="0.1" placeholder="0">
      <span class="lbl">Max DD%</span><input type="number" id="maxDD" min="0" step="1" placeholder="100">
      <button class="ghost" id="reset">Reset</button>
    </div>
    <div class="rail-row">
      <span class="lbl">Sort</span>
      <button class="sortbtn" data-s="profitFactor" aria-pressed="true">Profit factor<span class="dir">&darr;</span></button>
      <button class="sortbtn" data-s="netProfitPct" aria-pressed="false">Return<span class="dir"></span></button>
      <button class="sortbtn" data-s="maxDrawdownPct" aria-pressed="false">Max DD<span class="dir"></span></button>
      <button class="sortbtn" data-s="totalTrades" aria-pressed="false">Trades<span class="dir"></span></button>
      <button class="sortbtn" data-s="winRatePct" aria-pressed="false">Win rate<span class="dir"></span></button>
      <button class="sortbtn" data-s="lastTestedDate" aria-pressed="false">Last tested<span class="dir"></span></button>
    </div>
  </div>

  <div class="list" id="list"></div>
</div>

<dialog id="dlg">
  <div class="dlg-head">
    <h3 id="dlgTitle"></h3>
    <button class="btn" id="dlgCopy" hidden>Copy</button>
    <button class="btn" id="dlgClose">Close</button>
  </div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

    "pineSource": "//@version=6\n// VRS-1 \"Variance-Ratio Regime Switch\" — crypto port (24/7, no session filter)\n// KEPT: Lo-MacKinlay variance-ratio regime classification; Donchian breakout in TREND;\n//       Bollinger band-fade in REVERT; fixed ATR stop + target set at entry; max-hold flatten.\n// REFUSED/DROPPED: nothing forbidden was requested. No trailing stop (fixed SL/TP by design),\n//       no pyramiding, no cross-symbol data, no martingale or averaging down.\nstrategy(\"VRS-1 Variance-Ratio Regime Switch\", overlay=true,\n     pyramiding=1, process_orders_on_close=true,\n     commission_type=strategy.commission.percent, commission_value=0.05,\n     initial_capital=10000,\n     default_qty_type=strategy.percent_of_equity, default_qty_value=100,\n     margin_long=100, margin_short=100)\n\n// ---- inputs ----\nq       = input.int(5,     \"VR horizon q\")\nL       = input.int(120,   \"VR lookback\")\nvrHi    = input.float(1.15, \"Trend threshold\")\nvrLo    = input.float(0.85, \"Revert threshold\")\ndcLen   = input.int(20,    \"Donchian length\")\nbbLen   = input.int(20,    \"BB length\")\nbbMult  = input.float(2.0, \"BB mult\")\natrLen  = input.int(14,    \"ATR length\")\ntSL     = input.float(1.2, \"Trend SL xATR\")\ntTP     = input.float(2.4, \"Trend TP xATR\")\nrSL     = input.float(1.0, \"Revert SL xATR\")\nrTP     = input.float(1.2, \"Revert TP xATR\")\nmaxBars = input.int(48,    \"Max bars in trade\")\n\n// ---- variance ratio: VR = Var(q-bar move) / (q * Var(1-bar move)) ----\nr1 = close - close[1]\nrq = close - close[q]\nv1 = ta.variance(r1, L)\nvq = ta.variance(rq, L)\nvr = v1 > 0 ? vq / (q * v1) : na\n\n// ---- signal series ----\natr = ta.atr(atrLen)\n[bbMid, bbUp, bbLo] = ta.bb(close, bbLen, bbMult)\nhh = ta.highest(high, dcLen)[1]\nll = ta.lowest(low, dcLen)[1]\n\ntrendRegime  = not na(vr) and vr >= vrHi\nrevertRegime = not na(vr) and vr <= vrLo\n\nlongTrend  = trendRegime  and ta.crossover(close, hh)\nshortTrend = trendRegime  and ta.crossunder(close, ll)\nlongRev    = revertRegime and ta.crossover(close, bbLo)\nshortRev   = revertRegime and ta.crossunder(close, bbUp)\n\n// ---- state ----\nvar float slPx   = na\nvar float tpPx   = na\nvar int   barsIn = 0\n\nflat = strategy.position_size == 0\n\n// ---- entries: stop and target are both computed at the moment of entry ----\nif flat and longTrend\n    strategy.entry(\"L\", strategy.long)\n    slPx   := close - atr * tSL\n    tpPx   := close + atr * tTP\n    barsIn := 0\nelse if flat and shortTrend\n    strategy.entry(\"S\", strategy.short)\n    slPx   := close + atr * tSL\n    tpPx   := close - atr * tTP\n    barsIn := 0\nelse if flat and longRev\n    strategy.entry(\"L\", strategy.long)\n    slPx   := close - atr * rSL\n    tpPx   := close + atr * rTP\n    barsIn := 0\nelse if flat and shortRev\n    strategy.entry(\"S\", strategy.short)\n    slPx   := close + atr * rSL\n    tpPx   := close - atr * rTP\n    barsIn := 0\n\n// ---- exits: fixed bracket re-issued each bar at the SAME prices set on entry ----\nif strategy.position_size > 0\n    strategy.exit(\"LX\", from_entry=\"L\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\nif strategy.position_size < 0\n    strategy.exit(\"SX\", from_entry=\"S\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\n\n// ---- max-hold flatten (time stop, not a trailing stop) ----\nif barsIn >= maxBars and strategy.position_size != 0\n    strategy.close_all()\n    barsIn := 0\n\nplot(vr, title=\"VarianceRatio\")\nplot(trendRegime ? 1 : revertRegime ? -1 : 0, title=\"Regime\")\n",

    "pineSource": "//@version=6\n// VRS-1 \"Variance-Ratio Regime Switch\" — crypto port (24/7, no session filter)\n// KEPT: Lo-MacKinlay variance-ratio regime classification; Donchian breakout in TREND;\n//       Bollinger band-fade in REVERT; fixed ATR stop + target set at entry; max-hold flatten.\n// REFUSED/DROPPED: nothing forbidden was requested. No trailing stop (fixed SL/TP by design),\n//       no pyramiding, no cross-symbol data, no martingale or averaging down.\nstrategy(\"VRS-1 Variance-Ratio Regime Switch\", overlay=true,\n     pyramiding=1, process_orders_on_close=true,\n     commission_type=strategy.commission.percent, commission_value=0.05,\n     initial_capital=10000,\n     default_qty_type=strategy.percent_of_equity, default_qty_value=100,\n     margin_long=100, margin_short=100)\n\n// ---- inputs ----\nq       = input.int(5,     \"VR horizon q\")\nL       = input.int(120,   \"VR lookback\")\nvrHi    = input.float(1.15, \"Trend threshold\")\nvrLo    = input.float(0.85, \"Revert threshold\")\ndcLen   = input.int(20,    \"Donchian length\")\nbbLen   = input.int(20,    \"BB length\")\nbbMult  = input.float(2.0, \"BB mult\")\natrLen  = input.int(14,    \"ATR length\")\ntSL     = input.float(1.2, \"Trend SL xATR\")\ntTP     = input.float(2.4, \"Trend TP xATR\")\nrSL     = input.float(1.0, \"Revert SL xATR\")\nrTP     = input.float(1.2, \"Revert TP xATR\")\nmaxBars = input.int(48,    \"Max bars in trade\")\n\n// ---- variance ratio: VR = Var(q-bar move) / (q * Var(1-bar move)) ----\nr1 = close - close[1]\nrq = close - close[q]\nv1 = ta.variance(r1, L)\nvq = ta.variance(rq, L)\nvr = v1 > 0 ? vq / (q * v1) : na\n\n// ---- signal series ----\natr = ta.atr(atrLen)\n[bbMid, bbUp, bbLo] = ta.bb(close, bbLen, bbMult)\nhh = ta.highest(high, dcLen)[1]\nll = ta.lowest(low, dcLen)[1]\n\ntrendRegime  = not na(vr) and vr >= vrHi\nrevertRegime = not na(vr) and vr <= vrLo\n\nlongTrend  = trendRegime  and ta.crossover(close, hh)\nshortTrend = trendRegime  and ta.crossunder(close, ll)\nlongRev    = revertRegime and ta.crossover(close, bbLo)\nshortRev   = revertRegime and ta.crossunder(close, bbUp)\n\n// ---- state ----\nvar float slPx   = na\nvar float tpPx   = na\nvar int   barsIn = 0\n\nflat = strategy.position_size == 0\n\n// ---- entries: stop and target are both computed at the moment of entry ----\nif flat and longTrend\n    strategy.entry(\"L\", strategy.long)\n    slPx   := close - atr * tSL\n    tpPx   := close + atr * tTP\n    barsIn := 0\nelse if flat and shortTrend\n    strategy.entry(\"S\", strategy.short)\n    slPx   := close + atr * tSL\n    tpPx   := close - atr * tTP\n    barsIn := 0\nelse if flat and longRev\n    strategy.entry(\"L\", strategy.long)\n    slPx   := close - atr * rSL\n    tpPx   := close + atr * rTP\n    barsIn := 0\nelse if flat and shortRev\n    strategy.entry(\"S\", strategy.short)\n    slPx   := close + atr * rSL\n    tpPx   := close - atr * rTP\n    barsIn := 0\n\n// ---- exits: fixed bracket re-issued each bar at the SAME prices set on entry ----\nif strategy.position_size > 0\n    strategy.exit(\"LX\", from_entry=\"L\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\nif strategy.position_size < 0\n    strategy.exit(\"SX\", from_entry=\"S\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\n\n// ---- max-hold flatten (time stop, not a trailing stop) ----\nif barsIn >= maxBars and strategy.position_size != 0\n    strategy.close_all()\n    barsIn := 0\n\nplot(vr, title=\"VarianceRatio\")\nplot(trendRegime ? 1 : revertRegime ? -1 : 0, title=\"Regime\")\n",
    "specPath": "strategies/002-vrs-variance-ratio-regime-switch.md",

    "pineSource": "//@version=6\n// LCR-1 \"Liquidation Cascade Reclaim\" — BTCUSDT, 15m and 5m.\n// Detect a cascade bar (range expansion + volume spike + new 50-bar extreme), then let the CLOSE\n// POSITION inside that bar decide the side: a rejected flush is faded, a flush that closes on its\n// low is followed. Stop and target both fixed at entry; risk floored at 1.2% so the round-trip fee\n// stays a small fraction of R (HARD LESSON 3).\n// No trailing stop, no pyramiding, no averaging down, no martingale.\nstrategy(\"LCR-1 Liquidation Cascade Reclaim\", overlay=true,\n     pyramiding=1, process_orders_on_close=true,\n     commission_type=strategy.commission.percent, commission_value=0.05,\n     initial_capital=10000,\n     default_qty_type=strategy.percent_of_equity, default_qty_value=100,\n     margin_long=100, margin_short=100)\n\nlenN     = input.int(50,    \"Lookback for ATR / volume / extremes\")\nrangeK   = input.float(2.5, \"Cascade: range > K x ATR\")\nvolK     = input.float(3.0, \"Cascade: volume > K x average\")\nrevLo    = input.float(0.55,\"Down cascade: closePos at/above this = reversion long\")\ncontLo   = input.float(0.25,\"Down cascade: closePos at/below this = continuation short\")\nrevHi    = input.float(0.45,\"Up cascade: closePos at/below this = reversion short\")\ncontHi   = input.float(0.75,\"Up cascade: closePos at/above this = continuation long\")\nbufK     = input.float(0.2, \"Stop buffer beyond the cascade extreme, x ATR\")\nrr       = input.float(2.0, \"Reward:risk\")\nminRpct  = input.float(1.20,\"Min risk as % of price\")\nmaxRpct  = input.float(4.00,\"Max risk as % of price\")\nmaxBars  = input.int(96,    \"Max bars in trade\")\n\natrN   = ta.atr(lenN)\nvolAvg = ta.sma(volume, lenN)\nrng    = high - low\n\n// ---- cascade detection ----\nbigRange = not na(atrN) and atrN > 0 and rng > rangeK * atrN\nbigVol   = not na(volAvg) and volAvg > 0 and volume > volK * volAvg\ncascade  = bigRange and bigVol\n\nnewLow  = low  <= ta.lowest(low,  lenN)[1]\nnewHigh = high >= ta.highest(high, lenN)[1]\n\ndownCascade = cascade and newLow\nupCascade   = cascade and newHigh\n\nclosePos = rng > 0 ? (close - low) / rng : 0.5\n\n// ---- the regime switch: where the close sits decides the side ----\nrevLong   = downCascade and closePos >= revLo\ncontShort = downCascade and closePos <= contLo\nrevShort  = upCascade   and closePos <= revHi\ncontLong  = upCascade   and closePos >= contHi\n\n// ---- risk, floored so commission stays a small fraction of R ----\nbuf  = na(atrN) ? 0.0 : atrN * bufK\nminR = close * minRpct / 100\nmaxR = close * maxRpct / 100\n\nrawLongR  = close - (low - buf)\nrawShortR = (high + buf) - close\nlongR     = math.min(math.max(rawLongR,  minR), maxR)\nshortR    = math.min(math.max(rawShortR, minR), maxR)\n\ngoLong  = revLong  or contLong\ngoShort = revShort or contShort\n\nvar float slPx   = na\nvar float tpPx   = na\nvar int   barsIn = 0\n\nflat = strategy.position_size == 0\n\nif flat and goLong and longR > 0\n    strategy.entry(\"L\", strategy.long)\n    slPx   := close - longR\n    tpPx   := close + longR * rr\n    barsIn := 0\nelse if flat and goShort and shortR > 0\n    strategy.entry(\"S\", strategy.short)\n    slPx   := close + shortR\n    tpPx   := close - shortR * rr\n    barsIn := 0\n\nif strategy.position_size > 0\n    strategy.exit(\"LX\", from_entry=\"L\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\nif strategy.position_size < 0\n    strategy.exit(\"SX\", from_entry=\"S\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\n\nif barsIn >= maxBars and strategy.position_size != 0\n    strategy.close_all()\n    barsIn := 0\n\nplot(cascade ? 1 : 0,   title=\"CascadeBar\")\nplot(closePos,          title=\"ClosePos\")\nplot(revLong or revShort ? 1 : contLong or contShort ? -1 : 0, title=\"ReversionVsContinuation\")\n",

    "pineSource": "//@version=6\n// MAR-1 \"Moving-Average Retest Fade\" — BTCUSDT.\n// From a charted setup: a slow MA sloping down acts as resistance. Price rallies up, TAGS the MA,\n// and rejects back below it -> short. Target is the opposite band of a volatility channel.\n// Mirrored for an up-sloping MA. The MA slope IS the regime switch.\n// Stop and target both fixed at entry. No trailing stop, no pyramiding, no averaging down.\nstrategy(\"MAR-1 Moving-Average Retest Fade\", overlay=true,\n     pyramiding=1, process_orders_on_close=true,\n     commission_type=strategy.commission.percent, commission_value=0.05,\n     initial_capital=10000,\n     default_qty_type=strategy.percent_of_equity, default_qty_value=100,\n     margin_long=100, margin_short=100)\n\nslowLen  = input.int(200,   \"Slow MA length (the blue line)\")\nslopeLen = input.int(20,    \"Bars used to measure MA slope\")\nslopeMin = input.float(0.10,\"Min MA slope over that span, % of price\")\nbbLen    = input.int(20,    \"Band length\")\nbbMult   = input.float(2.0, \"Band multiplier\")\nbufK     = input.float(0.25,\"Stop buffer beyond the MA, x ATR\")\natrLen   = input.int(14,    \"ATR length\")\nminRpct  = input.float(0.80,\"Min risk as % of price\")\nmaxRpct  = input.float(3.00,\"Max risk as % of price\")\nminRR    = input.float(1.0, \"Target floor, in R\")\nmaxRR    = input.float(4.0, \"Target cap, in R\")\nmaxBars  = input.int(96,    \"Max bars in trade\")\n\nslowMA = ta.ema(close, slowLen)\natr    = ta.atr(atrLen)\n[bbMid, bbUp, bbLo] = ta.bb(close, bbLen, bbMult)\n\n// ---- regime: the slope of the slow MA ----\nslopeAbs = slowMA - slowMA[slopeLen]\nslopePct = close > 0 ? slopeAbs / close * 100 : 0.0\ndownTrend = not na(slowMA[slopeLen]) and slopePct <= -slopeMin\nupTrend   = not na(slowMA[slopeLen]) and slopePct >=  slopeMin\n\n// ---- the retest: price reaches the MA this bar, then closes back on the trend side ----\ntagFromBelow = high >= slowMA and close < slowMA and close < open\ntagFromAbove = low  <= slowMA and close > slowMA and close > open\n\ngoShort = downTrend and tagFromBelow\ngoLong  = upTrend   and tagFromAbove\n\n// ---- risk: stop beyond the MA that just rejected price ----\nbuf  = na(atr) ? 0.0 : atr * bufK\nminR = close * minRpct / 100\nmaxR = close * maxRpct / 100\n\nrawShortR = (slowMA + buf) - close\nrawLongR  = close - (slowMA - buf)\nshortR    = math.min(math.max(rawShortR, minR), maxR)\nlongR     = math.min(math.max(rawLongR,  minR), maxR)\n\n// ---- target: the opposite band, measured AT ENTRY and then never moved, clamped in R ----\nrawShortTP = bbLo\nrawLongTP  = bbUp\n\nvar float slPx   = na\nvar float tpPx   = na\nvar int   barsIn = 0\n\nflat = strategy.position_size == 0\n\nif flat and goShort and shortR > 0\n    strategy.entry(\"S\", strategy.short)\n    slPx := close + shortR\n    tgt   = math.min(math.max(rawShortTP, close - shortR * maxRR), close - shortR * minRR)\n    tpPx := tgt\n    barsIn := 0\nelse if flat and goLong and longR > 0\n    strategy.entry(\"L\", strategy.long)\n    slPx := close - longR\n    tgt   = math.max(math.min(rawLongTP, close + longR * maxRR), close + longR * minRR)\n    tpPx := tgt\n    barsIn := 0\n\nif strategy.position_size > 0\n    strategy.exit(\"LX\", from_entry=\"L\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\nif strategy.position_size < 0\n    strategy.exit(\"SX\", from_entry=\"S\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\n\nif barsIn >= maxBars and strategy.position_size != 0\n    strategy.close_all()\n    barsIn := 0\n\nplot(slowMA, title=\"SlowMA\")\nplot(slopePct, title=\"SlopePct\")\nplot(downTrend ? -1 : upTrend ? 1 : 0, title=\"Regime\")\n",
    "specPath": "strategies/004-mar-moving-average-retest-fade.md",
    "notes": "Ladder stopped at rung A: PF 0.65 < 0.95. 1 credit. The payoff ratio was FINE at 2.07:1 -- the risk geometry worked. Break-even at that ratio needs a ~33% win rate; it delivered 23.8%. The tell is avgBarsWinning 27.1 vs avgBarsLosing 12.3: losers die in half the time winners take, which is the signature of a stop sitting inside the noise. Entry was AT the MA and the stop a fraction of an ATR BEYOND it -- but price oscillates around a moving average by construction, so the stop was planted in the noisiest spot on the chart. Trade-count estimate was 500-1500 and actual was 844, a much better calibration than 003. Two untested fixes are written into the spec: require a confirmed rejection rather than the first tag, and place the stop above the swing structure instead of just above the MA."

    "pineSource": "//@version=6\n// CRX-1 \"Compression Release, Volume Verdict\" — BTCUSDT, 15m and 5m.\n// A range compresses; price breaks out; VOLUME decides whether the break is real.\n// Heavy volume -> follow the break. Thin volume -> fade it. In between -> no trade.\n// Stops sit beyond STRUCTURE (the opposite side of the box, or beyond the breakout extreme),\n// never just beyond the trigger level -- HARD LESSON 5.\n// SL and TP both fixed at entry. No trailing stop, no pyramiding, no averaging down, no martingale.\nstrategy(\"CRX-1 Compression Release Volume Verdict\", overlay=true,\n     pyramiding=1, process_orders_on_close=true,\n     commission_type=strategy.commission.percent, commission_value=0.05,\n     initial_capital=10000,\n     default_qty_type=strategy.percent_of_equity, default_qty_value=100,\n     margin_long=100, margin_short=100)\n\nboxLen   = input.int(48,    \"Compression box length\")\natrLong  = input.int(100,   \"ATR length for the compression yardstick\")\ntightK   = input.float(3.0, \"Compressed if box width < K x ATR\")\nholdBars = input.int(5,     \"Bars the box must stay compressed\")\nvolLen   = input.int(50,    \"Volume average length\")\nvolHi    = input.float(2.0, \"Follow the break if volume >= K x average\")\nvolLo    = input.float(1.0, \"Fade the break if volume < K x average\")\nbufK     = input.float(0.25,\"Structural stop buffer, x ATR14\")\nrr       = input.float(1.8, \"Reward:risk\")\nminRpct  = input.float(0.80,\"Min risk as % of price\")\nmaxRpct  = input.float(3.00,\"Max risk as % of price\")\nmaxBars  = input.int(96,    \"Max bars in trade\")\n\natrL   = ta.atr(atrLong)\natrS   = ta.atr(14)\nvolAvg = ta.sma(volume, volLen)\n\n// ---- the box, measured BEFORE this bar so the breakout bar cannot widen it ----\nboxHi = ta.highest(high, boxLen)[1]\nboxLo = ta.lowest(low,  boxLen)[1]\nboxW  = boxHi - boxLo\n\ntight = not na(atrL) and atrL > 0 and boxW < atrL * tightK\n// compression must have been sustained, not a one-bar accident\nheld  = tight[1] and tight[2] and tight[3] and tight[4] and tight[5]\n\n// ---- the release ----\nbreakUp = ta.crossover(close, boxHi)\nbreakDn = ta.crossunder(close, boxLo)\n\n// ---- the verdict: volume decides follow vs fade. Between the thresholds is a dead band. ----\nheavy = not na(volAvg) and volAvg > 0 and volume >= volAvg * volHi\nthin  = not na(volAvg) and volAvg > 0 and volume <  volAvg * volLo\n\nfollowLong  = held and breakUp and heavy\nfollowShort = held and breakDn and heavy\nfadeShort   = held and breakUp and thin\nfadeLong    = held and breakDn and thin\n\n// ---- structural risk ----\nbuf  = na(atrS) ? 0.0 : atrS * bufK\nminR = close * minRpct / 100\nmaxR = close * maxRpct / 100\n\n// follow: stop at the far side of the box. fade: stop beyond the breakout bar's extreme.\nrawFollowLongR  = close - (boxLo - buf)\nrawFollowShortR = (boxHi + buf) - close\nrawFadeShortR   = (high + buf) - close\nrawFadeLongR    = close - (low - buf)\n\ngoLong  = followLong or fadeLong\ngoShort = followShort or fadeShort\nrawLongR  = followLong  ? rawFollowLongR  : rawFadeLongR\nrawShortR = followShort ? rawFollowShortR : rawFadeShortR\nlongR     = math.min(math.max(rawLongR,  minR), maxR)\nshortR    = math.min(math.max(rawShortR, minR), maxR)\n\nvar float slPx   = na\nvar float tpPx   = na\nvar int   barsIn = 0\n\nflat = strategy.position_size == 0\n\nif flat and goLong and longR > 0\n    strategy.entry(\"L\", strategy.long)\n    slPx   := close - longR\n    tpPx   := close + longR * rr\n    barsIn := 0\nelse if flat and goShort and shortR > 0\n    strategy.entry(\"S\", strategy.short)\n    slPx   := close + shortR\n    tpPx   := close - shortR * rr\n    barsIn := 0\n\nif strategy.position_size > 0\n    strategy.exit(\"LX\", from_entry=\"L\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\nif strategy.position_size < 0\n    strategy.exit(\"SX\", from_entry=\"S\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\n\nif barsIn >= maxBars and strategy.position_size != 0\n    strategy.close_all()\n    barsIn := 0\n\nplot(boxW,                       title=\"BoxWidth\")\nplot(held ? 1 : 0,               title=\"CompressionHeld\")\nplot(heavy ? 1 : thin ? -1 : 0,  title=\"VolumeVerdict\")\n",

    "notes": "Ladder stopped at rung A: PF 0.52 < 0.95. 1 credit. Payoff ratio was healthy at 2.33:1 (break-even ~30%) but the win rate was 18.3% -- WORSE than the ~37% the literature reports for UNFILTERED breakouts, so the volume verdict was not just unhelpful, it selected a worse subset. I also violated HARD LESSON 5 on the fade leg without noticing: the follow leg got a proper structural stop at the far side of the box, but the fade leg's stop sat just beyond the breakout bar's extreme, inside the noise. Thin-volume bars are far more common than 2x-volume bars, so fades likely dominated the sample. Same diagnostic as 004: avgBarsWinning 75.6 vs avgBarsLosing 31.7. Frequency estimate was 200-600 and actual was 93 -- missed LOW by ~2x, the opposite direction from 003's miss."

    "pineSource": "//@version=6\n// VTS-1 \"Volatility Term-Structure Regime\" — BTCUSDT, 15m and 5m.\n// Bitcoin shows INVERTED volatility asymmetry: vol reacts more to positive returns than negative\n// ones, the opposite of equities. So the two legs are built differently, not mirrored:\n//   LONG  = breakout WITH vol expansion   (BTC's real up-moves arrive loud)\n//   SHORT = breakdown WITH vol compression (BTC's distribution arrives quiet)\n// Flip signal: the term-structure ratio crossing either threshold. On a flip, stand down for\n// coolBars bars -- the regime is in transition and neither leg's premise holds.\n// SL and TP fixed at entry. Stops sit beyond STRUCTURE (swing extremes), never beyond the trigger.\nstrategy(\"VTS-1 Volatility Term-Structure Regime\", overlay=true,\n     pyramiding=1, process_orders_on_close=true,\n     commission_type=strategy.commission.percent, commission_value=0.05,\n     initial_capital=10000,\n     default_qty_type=strategy.percent_of_equity, default_qty_value=100,\n     margin_long=100, margin_short=100)\n\nfastLen  = input.int(5,     \"Fast ATR (short horizon)\")\nslowLen  = input.int(50,    \"Slow ATR (long horizon)\")\nhiK      = input.float(1.40,\"Expansion if fast/slow >= K\")\nloK      = input.float(0.75,\"Compression if fast/slow <= K\")\nbrkLen   = input.int(50,    \"Breakout lookback\")\nswgLen   = input.int(20,    \"Swing lookback for the structural stop\")\ncoolBars = input.int(20,    \"Bars to stand down after a regime flip\")\nbufK     = input.float(0.25,\"Stop buffer beyond the swing, x ATR14\")\nrr       = input.float(2.0, \"Reward:risk\")\nminRpct  = input.float(0.80,\"Min risk as % of price\")\nmaxRpct  = input.float(3.00,\"Max risk as % of price\")\nmaxBars  = input.int(96,    \"Max bars in trade\")\n\natrFast = ta.atr(fastLen)\natrSlow = ta.atr(slowLen)\natrStop = ta.atr(14)\n\n// ---- the term structure ----\nvts = (not na(atrSlow) and atrSlow > 0) ? atrFast / atrSlow : na\n\nexpansion   = not na(vts) and vts >= hiK\ncompression = not na(vts) and vts <= loK\n\n// ---- FLIP DETECTION: the regime changing, in either direction ----\nregime     = expansion ? 1 : compression ? -1 : 0\nflipped    = regime != regime[1] and not na(vts) and not na(vts[1])\nvar int sinceFlip = 9999\nsinceFlip := flipped ? 0 : sinceFlip + 1\ncoolingOff = sinceFlip < coolBars\n\n// ---- levels ----\nbrkHi = ta.highest(high, brkLen)[1]\nbrkLo = ta.lowest(low,  brkLen)[1]\nswgHi = ta.highest(high, swgLen)[1]\nswgLo = ta.lowest(low,  swgLen)[1]\n\n// ---- LONG leg: the loud breakout. Needs vol EXPANSION. ----\ngoLong = expansion and not coolingOff and ta.crossover(close, brkHi)\n\n// ---- SHORT leg: the quiet breakdown. Needs vol COMPRESSION. Different premise entirely. ----\ngoShort = compression and not coolingOff and ta.crossunder(close, brkLo)\n\n// ---- risk: each leg stops beyond its OWN structure, floored so fees stay small vs R ----\nbuf  = na(atrStop) ? 0.0 : atrStop * bufK\nminR = close * minRpct / 100\nmaxR = close * maxRpct / 100\n\nrawLongR  = close - (swgLo - buf)\nrawShortR = (swgHi + buf) - close\nlongR     = math.min(math.max(rawLongR,  minR), maxR)\nshortR    = math.min(math.max(rawShortR, minR), maxR)\n\nvar float slPx   = na\nvar float tpPx   = na\nvar int   barsIn = 0\n\nflat = strategy.position_size == 0\n\nif flat and goLong and longR > 0\n    strategy.entry(\"L\", strategy.long)\n    slPx   := close - longR\n    tpPx   := close + longR * rr\n    barsIn := 0\nelse if flat and goShort and shortR > 0\n    strategy.entry(\"S\", strategy.short)\n    slPx   := close + shortR\n    tpPx   := close - shortR * rr\n    barsIn := 0\n\nif strategy.position_size > 0\n    strategy.exit(\"LX\", from_entry=\"L\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\nif strategy.position_size < 0\n    strategy.exit(\"SX\", from_entry=\"S\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\n\nif barsIn >= maxBars and strategy.position_size != 0\n    strategy.close_all()\n    barsIn := 0\n\nplot(vts,                  title=\"VolTermStructure\")\nplot(regime,               title=\"Regime\")\nplot(flipped ? 1 : 0,      title=\"FlipEvent\")\nplot(coolingOff ? 1 : 0,   title=\"CoolingOff\")\n",
    "specPath": "strategies/006-vts-volatility-term-structure-regime.md",

const BUILT = "2026-09-02 04:41";

const $ = (s) => document.querySelector(s);
const list = $('#list');
$('#stamp').textContent = DATA.length
  ? DATA.length + ' backtested · built ' + BUILT
  : 'No backtests yet · built ' + BUILT;

const state = {
  q:'', status:new Set(), sym:'', tf:'', dir:'',
  minT:null, minPF:null, maxDD:null, sort:'profitFactor', desc:true
};
// Drawdown is the one axis where lower is better, so it defaults to ascending.
const ASC_IS_BETTER = new Set(['maxDrawdownPct']);

const ENT = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ENT[c]);
const n1 = (v) => v.toFixed(1);
const n2 = (v) => v.toFixed(2);
const sign = (v) => (v > 0 ? '+' : '') + n1(v) + '%';

function fillSelect(el, vals){
  vals.forEach((v) => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v; el.appendChild(o);
  });
}
fillSelect($('#sym'), [...new Set(DATA.map((d) => d.symbol))].sort());
fillSelect($('#tf'),  [...new Set(DATA.map((d) => d.timeframe))].sort());
fillSelect($('#dir'), [...new Set(DATA.map((d) => d.direction))].sort());

function summary(rows){
  let cells;
  if (!DATA.length){
    cells = [['Strategies backtested','0'],['Passed','0'],['Best profit factor','—'],
             ['Lowest max DD','—'],['Total trades','—']];
  } else {
    const pf = rows.map((r) => r.metrics.profitFactor);
    const dd = rows.map((r) => r.metrics.maxDrawdownPct);
    cells = [
      ['Strategies backtested', String(DATA.length)],
      ['Passed', String(DATA.filter((r) => r.status === 'passed').length)],
      ['Best profit factor', pf.length ? n2(Math.max.apply(null, pf)) : '—'],
      ['Lowest max DD', dd.length ? n1(Math.min.apply(null, dd)) + '%' : '—'],
      ['Total trades', String(rows.reduce((a, r) => a + r.metrics.totalTrades, 0))]
    ];
  }
  $('#strip').innerHTML = cells.map(
    (c) => '<div class="cell"><div class="k">' + esc(c[0]) + '</div><div class="v">' + esc(c[1]) + '</div></div>'
  ).join('');
}

function apply(){
  const rows = DATA.filter((r) => {
    if (state.status.size && !state.status.has(r.status)) return false;
    if (state.sym && r.symbol !== state.sym) return false;
    if (state.tf && r.timeframe !== state.tf) return false;
    if (state.dir && r.direction !== state.dir) return false;
    if (state.minT !== null && r.metrics.totalTrades < state.minT) return false;
    if (state.minPF !== null && r.metrics.profitFactor < state.minPF) return false;
    if (state.maxDD !== null && r.metrics.maxDrawdownPct > state.maxDD) return false;
    if (state.q){
      const hay = (r.name + ' ' + r.description + ' ' + r.symbol).toLowerCase();
      if (hay.indexOf(state.q.toLowerCase()) === -1) return false;
    }
    return true;
  });
  const k = state.sort;
  rows.sort((a, b) => {
    const av = k === 'lastTestedDate' ? a[k] : a.metrics[k];
    const bv = k === 'lastTestedDate' ? b[k] : b.metrics[k];
    const c = av < bv ? -1 : av > bv ? 1 : 0;
    return state.desc ? -c : c;
  });
  summary(rows);
  $('#count').textContent = DATA.length ? rows.length + ' of ' + DATA.length : '';
  render(rows);
}

function metric(k, v, cls){
  return '<div class="m"><div class="k">' + k + '</div><div class="v ' + (cls || '') + '">' + v + '</div></div>';
}

function render(rows){
  if (!DATA.length){ list.innerHTML = emptyState(); return; }
  if (!rows.length){
    list.innerHTML = '<div class="empty"><h3>No strategies match these filters</h3>' +
      '<p>Loosen a threshold or clear the filters to see the full set.</p></div>';
    return;
  }
  list.innerHTML = rows.map((r) => {
    const m = r.metrics;
    const full = (r.provenance && r.provenance.backtestUrl)
      ? '<a class="btn primary" href="' + esc(r.provenance.backtestUrl) + '" target="_blank" rel="noopener">Full backtest</a>'
      : '<button class="btn primary" disabled>Full backtest</button>';
    return '<article class="row" data-status="' + esc(r.status) + '"><div class="stripe"></div><div class="row-in">' +
      '<div class="row-head"><h2>' + esc(r.name) + '</h2>' +
        '<span class="pill ' + esc(r.status) + '">' + esc(r.status) + '</span>' +
        '<span class="tag">' + esc(r.symbol) + '</span>' +
        '<span class="tag">' + esc(r.timeframe) + '</span>' +
        '<span class="tag">' + esc(r.direction) + '</span></div>' +
      '<p class="desc">' + esc(r.description) + '</p>' +
      '<div class="metrics">' +
        metric('Net return', sign(m.netProfitPct), m.netProfitPct >= 0 ? 'pos' : 'neg') +
        metric('Profit factor', n2(m.profitFactor), m.profitFactor >= 1 ? 'pos' : 'neg') +
        metric('Max drawdown', n1(m.maxDrawdownPct) + '%') +
        metric('Trades', String(m.totalTrades)) +
        metric('Win rate', n1(m.winRatePct) + '%') +
        metric('Avg trade', sign(m.avgTradePct), m.avgTradePct >= 0 ? 'pos' : 'neg') +
      '</div>' +
      '<div class="row-foot"><div class="dates">' +
        '<span>Tested ' + esc(r.backtestStart) + ' → ' + esc(r.backtestEnd) + '</span>' +
        '<span>Created ' + esc(r.createdDate) + '</span>' +
        '<span>Last tested ' + esc(r.lastTestedDate) + '</span></div>' +
      '<div class="acts">' +
        '<button class="btn" data-act="rules" data-id="' + esc(r.id) + '">Rules</button>' +
        '<button class="btn" data-act="pine" data-id="' + esc(r.id) + '"' + (r.pineSource ? '' : ' disabled') + '>Pine script</button>' +
        full +
      '</div></div></div></article>';
  }).join('');
}

function emptyState(){
  return '<div class="empty">' +
    '<h3>Nothing has been backtested yet</h3>' +
    '<p>This panel only ever shows strategies with a recorded backtest behind them. Specifications that ' +
    'have not been run do not appear here.</p>' +
    '<ol>' +
      '<li>Code the strategy as Pine v6 and run a real backtest.</li>' +
      '<li>Read the metrics off the returned report.</li>' +
      '<li>Append a record to <code>results/backtests.json</code>.</li>' +
      '<li>Run <code>python build_dashboard.py</code>.</li>' +
      '<li>Republish <code>dashboard/dashboard.html</code> to this same URL.</li>' +
    '</ol>' +
    '<div class="gate"><b>Build-time gate.</b> The generator rejects any record without a ' +
    '<code>provenance</code> block naming a real backtest job or report URL, and any record whose trade ' +
    'count is zero. Estimated or invented numbers cannot reach this page &mdash; the build fails instead.</div>' +
  '</div>';
}

$('#q').addEventListener('input', (e) => { state.q = e.target.value.trim(); apply(); });

document.querySelectorAll('.chip').forEach((b) => {
  b.addEventListener('click', () => {
    const v = b.dataset.v;
    const on = b.getAttribute('aria-pressed') === 'true';
    b.setAttribute('aria-pressed', String(!on));
    if (on) state.status.delete(v); else state.status.add(v);
    apply();
  });
});

function bindSel(id, key){
  $(id).addEventListener('change', (e) => { state[key] = e.target.value; apply(); });
}
bindSel('#sym','sym'); bindSel('#tf','tf'); bindSel('#dir','dir');

function bindNum(id, key){
  $(id).addEventListener('input', (e) => {
    const v = e.target.value;
    state[key] = v === '' ? null : Number(v);
    apply();
  });
}
bindNum('#minT','minT'); bindNum('#minPF','minPF'); bindNum('#maxDD','maxDD');

document.querySelectorAll('.sortbtn').forEach((b) => {
  b.addEventListener('click', () => {
    const s = b.dataset.s;
    if (state.sort === s){ state.desc = !state.desc; }
    else { state.sort = s; state.desc = !ASC_IS_BETTER.has(s); }
    document.querySelectorAll('.sortbtn').forEach((o) => {
      const active = o.dataset.s === state.sort;
      o.setAttribute('aria-pressed', String(active));
      o.querySelector('.dir').textContent = active ? (state.desc ? '↓' : '↑') : '';
    });
    apply();
  });
});

$('#reset').addEventListener('click', () => {
  state.q = ''; state.sym = ''; state.tf = ''; state.dir = '';
  state.minT = null; state.minPF = null; state.maxDD = null;
  state.status.clear();
  $('#q').value = ''; $('#sym').value = ''; $('#tf').value = ''; $('#dir').value = '';
  $('#minT').value = ''; $('#minPF').value = ''; $('#maxDD').value = '';
  document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed','false'));
  apply();
});

const dlg = $('#dlg');
const dlgBody = $('#dlgBody');
const dlgTitle = $('#dlgTitle');
const dlgCopy = $('#dlgCopy');
let copyText = '';

list.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const r = DATA.filter((x) => x.id === b.dataset.id)[0];
  if (!r) return;
  if (b.dataset.act === 'pine'){
    dlgTitle.textContent = r.name + ' — Pine v6';
    dlgBody.innerHTML = '<pre>' + esc(r.pineSource) + '</pre>';
    copyText = r.pineSource;
    dlgCopy.hidden = false;
    dlgCopy.textContent = 'Copy';
  } else {
    dlgTitle.textContent = r.name + ' — rules';
    dlgBody.innerHTML = '<div class="prose">' + esc(r.description) +
      (r.specPath ? '<p class="spec-note">Full spec: <code>' + esc(r.specPath) + '</code></p>' : '') +
      (r.notes ? '<p class="spec-note">' + esc(r.notes) + '</p>' : '') + '</div>';
    dlgCopy.hidden = true;
  }
  dlg.showModal();
});

dlgCopy.addEventListener('click', () => {
  navigator.clipboard.writeText(copyText).then(
    () => { dlgCopy.textContent = 'Copied'; },
    () => { dlgCopy.textContent = 'Press Ctrl+C'; }
  );
});
$('#dlgClose').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });

apply();
</script>
