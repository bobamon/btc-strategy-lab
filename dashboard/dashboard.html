  --border:#DDE3EA; --border-2:#C8D1DC;
  --accent:#2B4C8C; --accent-ink:#FFFFFF; --accent-soft:#E7ECF7;

  --research:#94A2B2; --research-soft:#212B36;
  --rejected:#F87171; --rejected-soft:#331717;
  --pos:#4ADE80; --neg:#F87171;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 72px}

.mast{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.mast h1{
  font-family:Archivo,ui-sans-serif,system-ui,sans-serif;font-weight:700;
  font-size:clamp(24px,3.2vw,33px);letter-spacing:-.02em;margin:0;text-wrap:balance;
}
.mast p{margin:6px 0 0;color:var(--muted);max-width:62ch;font-size:14px}
.stamp{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);border:1px solid var(--border);
  border-radius:999px;padding:5px 11px;white-space:nowrap;
}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;margin-bottom:24px}
.cell{background:var(--surface);padding:13px 15px}
.cell .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}
.cell .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:21px;font-weight:600;margin-top:3px;letter-spacing:-.01em}

.rail{position:sticky;top:0;z-index:20;background:var(--ground);
  padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:4px}
.rail-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.rail-row + .rail-row{margin-top:9px}
.lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  font-weight:600;margin-right:2px}
input[type=search],select,input[type=number]{
  font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);
  border:1px solid var(--border-2);border-radius:7px;padding:7px 10px;min-width:0;
}
input[type=search]{flex:1 1 210px;max-width:320px}
input[type=number]{width:88px;font-family:"IBM Plex Mono",monospace}
select{cursor:pointer}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.chip{
  font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--border-2);
  border-radius:999px;padding:6px 13px;transition:background .12s,border-color .12s,color .12s;
}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sortbtn{
  font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;background:var(--surface);
  color:var(--ink-2);border:1px solid var(--border-2);border-radius:7px;padding:6px 11px;
}
.sortbtn:hover{border-color:var(--accent)}
.sortbtn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sortbtn .dir{font-family:"IBM Plex Mono",monospace;opacity:.75;margin-left:4px}
.ghost{
  font:inherit;font-size:12.5px;cursor:pointer;background:none;border:none;
  color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:6px 4px;
}
.count{margin-left:auto;font-size:12.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace}

.list{display:flex;flex-direction:column;gap:11px;margin-top:18px}
.row{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:5px 1fr}
.stripe{background:var(--research)}
.row[data-status=passed] .stripe{background:var(--pass)}
.row[data-status=testing] .stripe{background:var(--testing)}
.row[data-status=rejected] .stripe{background:var(--rejected)}
.row-in{padding:15px 17px}
.row-head{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin-bottom:3px}
.row-head h2{font-family:Archivo,sans-serif;font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.pill{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.research{background:var(--research-soft);color:var(--research)}
.pill.testing{background:var(--testing-soft);color:var(--testing)}
.pill.passed{background:var(--pass-soft);color:var(--pass)}
.pill.rejected{background:var(--rejected-soft);color:var(--rejected)}
.tag{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:2px 7px}
.desc{color:var(--muted);font-size:13.5px;margin:7px 0 13px;max-width:78ch}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:11px;
  padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.m .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.m .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:17px;font-weight:600;margin-top:2px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.row-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.dates{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);
  display:flex;flex-wrap:wrap;gap:12px}
.acts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;text-decoration:none;
  display:inline-block;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--border-2);border-radius:7px;padding:6px 12px;transition:border-color .12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{color:var(--accent-ink);opacity:.9}

.empty{border:1px dashed var(--border-2);border-radius:var(--r);background:var(--surface);
  padding:34px 30px;text-align:left}
.empty h3{font-family:Archivo,sans-serif;font-size:19px;margin:0 0 8px;font-weight:600}
.empty p{color:var(--muted);margin:0 0 16px;max-width:66ch;font-size:14px}
.empty ol{color:var(--ink-2);margin:0;padding-left:20px;max-width:66ch;font-size:14px}
.empty li{margin-bottom:7px}
.empty code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.gate{margin-top:20px;padding:13px 15px;background:var(--surface-2);
  border-left:3px solid var(--accent);border-radius:0 7px 7px 0;font-size:13.5px;color:var(--ink-2)}
.gate b{color:var(--ink)}

dialog{border:none;border-radius:12px;padding:0;background:var(--surface);color:var(--ink);
  max-width:min(920px,94vw);width:100%;box-shadow:0 12px 48px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(10,14,19,.62)}
.dlg-head{display:flex;gap:12px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--border)}
.dlg-head h3{font-family:Archivo,sans-serif;font-size:16px;margin:0;font-weight:600;flex:1}
.dlg-body{padding:0;max-height:68vh;overflow:auto}
.dlg-body pre{margin:0;padding:18px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  line-height:1.6;white-space:pre;overflow-x:auto;color:var(--ink-2)}
.dlg-body .prose{padding:18px;font-size:14px;color:var(--ink-2)}
.spec-note{margin-top:14px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<div class="wrap">
  <header class="mast">
    <div>
      <h1>Strategy Control Panel</h1>
      <p>Backtested BTCUSDT strategies. Every row is generated from a recorded backtest &mdash; nothing here is estimated.</p>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>

  <section class="strip" id="strip"></section>

  <div class="rail">
    <div class="rail-row">
      <input type="search" id="q" placeholder="Search name or rules&hellip;" aria-label="Search strategies">
      <span class="lbl">Status</span>
      <button class="chip" data-f="status" data-v="passed" aria-pressed="false">Passed</button>
      <button class="chip" data-f="status" data-v="testing" aria-pressed="false">Testing</button>
      <button class="chip" data-f="status" data-v="research" aria-pressed="false">Research</button>
      <button class="chip" data-f="status" data-v="rejected" aria-pressed="false">Rejected</button>
      <span class="count" id="count"></span>
    </div>
    <div class="rail-row">
      <span class="lbl">Symbol</span>
      <select id="sym" aria-label="Filter by symbol"><option value="">All</option></select>
      <span class="lbl">TF</span>
      <select id="tf" aria-label="Filter by timeframe"><option value="">All</option></select>
      <span class="lbl">Side</span>
      <select id="dir" aria-label="Filter by direction"><option value="">All</option></select>
      <span class="lbl">Min trades</span><input type="number" id="minT" min="0" step="10" placeholder="0">
      <span class="lbl">Min PF</span><input type="number" id="minPF" min="0" step="0.1" placeholder="0">
      <span class="lbl">Max DD%</span><input type="number" id="maxDD" min="0" step="1" placeholder="100">
      <button class="ghost" id="reset">Reset</button>
    </div>
    <div class="rail-row">
      <span class="lbl">Sort</span>
      <button class="sortbtn" data-s="profitFactor" aria-pressed="true">Profit factor<span class="dir">&darr;</span></button>
      <button class="sortbtn" data-s="netProfitPct" aria-pressed="false">Return<span class="dir"></span></button>
      <button class="sortbtn" data-s="maxDrawdownPct" aria-pressed="false">Max DD<span class="dir"></span></button>
      <button class="sortbtn" data-s="totalTrades" aria-pressed="false">Trades<span class="dir"></span></button>
      <button class="sortbtn" data-s="winRatePct" aria-pressed="false">Win rate<span class="dir"></span></button>
      <button class="sortbtn" data-s="lastTestedDate" aria-pressed="false">Last tested<span class="dir"></span></button>
    </div>
  </div>

  <div class="list" id="list"></div>
</div>

<dialog id="dlg">
  <div class="dlg-head">
    <h3 id="dlgTitle"></h3>
    <button class="btn" id="dlgCopy" hidden>Copy</button>
    <button class="btn" id="dlgClose">Close</button>
  </div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

    o.value = v; o.textContent = v; el.appendChild(o);
  });
}
fillSelect($('#sym'), [...new Set(DATA.map((d) => d.symbol))].sort());
fillSelect($('#tf'),  [...new Set(DATA.map((d) => d.timeframe))].sort());
fillSelect($('#dir'), [...new Set(DATA.map((d) => d.direction))].sort());

function summary(rows){
  let cells;
  if (!DATA.length){
    cells = [['Strategies backtested','0'],['Passed','0'],['Best profit factor','—'],
             ['Lowest max DD','—'],['Total trades','—']];
  } else {
    const pf = rows.map((r) => r.metrics.profitFactor);
    const dd = rows.map((r) => r.metrics.maxDrawdownPct);
    cells = [
      ['Strategies backtested', String(DATA.length)],
      ['Passed', String(DATA.filter((r) => r.status === 'passed').length)],
      ['Best profit factor', pf.length ? n2(Math.max.apply(null, pf)) : '—'],
      ['Lowest max DD', dd.length ? n1(Math.min.apply(null, dd)) + '%' : '—'],
      ['Total trades', String(rows.reduce((a, r) => a + r.metrics.totalTrades, 0))]
    ];
  }
  $('#strip').innerHTML = cells.map(
    (c) => '<div class="cell"><div class="k">' + esc(c[0]) + '</div><div class="v">' + esc(c[1]) + '</div></div>'
  ).join('');
}

function apply(){
  const rows = DATA.filter((r) => {
    if (state.status.size && !state.status.has(r.status)) return false;
    if (state.sym && r.symbol !== state.sym) return false;
    if (state.tf && r.timeframe !== state.tf) return false;
    if (state.dir && r.direction !== state.dir) return false;
    if (state.minT !== null && r.metrics.totalTrades < state.minT) return false;
    if (state.minPF !== null && r.metrics.profitFactor < state.minPF) return false;
    if (state.maxDD !== null && r.metrics.maxDrawdownPct > state.maxDD) return false;
    if (state.q){
      const hay = (r.name + ' ' + r.description + ' ' + r.symbol).toLowerCase();
      if (hay.indexOf(state.q.toLowerCase()) === -1) return false;
    }
    return true;
  });
  const k = state.sort;
  rows.sort((a, b) => {
    const av = k === 'lastTestedDate' ? a[k] : a.metrics[k];
    const bv = k === 'lastTestedDate' ? b[k] : b.metrics[k];
    const c = av < bv ? -1 : av > bv ? 1 : 0;
    return state.desc ? -c : c;
  });
  summary(rows);
  $('#count').textContent = DATA.length ? rows.length + ' of ' + DATA.length : '';
  render(rows);
}

function metric(k, v, cls){
  return '<div class="m"><div class="k">' + k + '</div><div class="v ' + (cls || '') + '">' + v + '</div></div>';
}

function render(rows){
  if (!DATA.length){ list.innerHTML = emptyState(); return; }
  if (!rows.length){
    list.innerHTML = '<div class="empty"><h3>No strategies match these filters</h3>' +
      '<p>Loosen a threshold or clear the filters to see the full set.</p></div>';
    return;
  }
  list.innerHTML = rows.map((r) => {
    const m = r.metrics;
    const full = (r.provenance && r.provenance.backtestUrl)
      ? '<a class="btn primary" href="' + esc(r.provenance.backtestUrl) + '" target="_blank" rel="noopener">Full backtest</a>'
      : '<button class="btn primary" disabled>Full backtest</button>';
    return '<article class="row" data-status="' + esc(r.status) + '"><div class="stripe"></div><div class="row-in">' +
      '<div class="row-head"><h2>' + esc(r.name) + '</h2>' +
        '<span class="pill ' + esc(r.status) + '">' + esc(r.status) + '</span>' +
        '<span class="tag">' + esc(r.symbol) + '</span>' +
        '<span class="tag">' + esc(r.timeframe) + '</span>' +
        '<span class="tag">' + esc(r.direction) + '</span></div>' +
      '<p class="desc">' + esc(r.description) + '</p>' +
      '<div class="metrics">' +
        metric('Net return', sign(m.netProfitPct), m.netProfitPct >= 0 ? 'pos' : 'neg') +
        metric('Profit factor', n2(m.profitFactor), m.profitFactor >= 1 ? 'pos' : 'neg') +
        metric('Max drawdown', n1(m.maxDrawdownPct) + '%') +
        metric('Trades', String(m.totalTrades)) +
        metric('Win rate', n1(m.winRatePct) + '%') +
        metric('Avg trade', sign(m.avgTradePct), m.avgTradePct >= 0 ? 'pos' : 'neg') +
      '</div>' +
      '<div class="row-foot"><div class="dates">' +
        '<span>Tested ' + esc(r.backtestStart) + ' → ' + esc(r.backtestEnd) + '</span>' +
        '<span>Created ' + esc(r.createdDate) + '</span>' +
        '<span>Last tested ' + esc(r.lastTestedDate) + '</span></div>' +
      '<div class="acts">' +
        '<button class="btn" data-act="rules" data-id="' + esc(r.id) + '">Rules</button>' +
        '<button class="btn" data-act="pine" data-id="' + esc(r.id) + '"' + (r.pineSource ? '' : ' disabled') + '>Pine script</button>' +
        full +
      '</div></div></div></article>';
  }).join('');
}

function emptyState(){
  return '<div class="empty">' +
    '<h3>Nothing has been backtested yet</h3>' +
    '<p>This panel only ever shows strategies with a recorded backtest behind them. Specifications that ' +
    'have not been run do not appear here.</p>' +
    '<ol>' +
      '<li>Code the strategy as Pine v6 and run a real backtest.</li>' +
      '<li>Read the metrics off the returned report.</li>' +
      '<li>Append a record to <code>results/backtests.json</code>.</li>' +
      '<li>Run <code>python build_dashboard.py</code>.</li>' +
      '<li>Republish <code>dashboard/dashboard.html</code> to this same URL.</li>' +
    '</ol>' +
    '<div class="gate"><b>Build-time gate.</b> The generator rejects any record without a ' +
    '<code>provenance</code> block naming a real backtest job or report URL, and any record whose trade ' +
    'count is zero. Estimated or invented numbers cannot reach this page &mdash; the build fails instead.</div>' +
  '</div>';
}

$('#q').addEventListener('input', (e) => { state.q = e.target.value.trim(); apply(); });

document.querySelectorAll('.chip').forEach((b) => {
  b.addEventListener('click', () => {
    const v = b.dataset.v;
    const on = b.getAttribute('aria-pressed') === 'true';
    b.setAttribute('aria-pressed', String(!on));
    if (on) state.status.delete(v); else state.status.add(v);
    apply();
  });
});

function bindSel(id, key){
  $(id).addEventListener('change', (e) => { state[key] = e.target.value; apply(); });
}
bindSel('#sym','sym'); bindSel('#tf','tf'); bindSel('#dir','dir');

function bindNum(id, key){
  $(id).addEventListener('input', (e) => {
    const v = e.target.value;
    state[key] = v === '' ? null : Number(v);
    apply();
  });
}
bindNum('#minT','minT'); bindNum('#minPF','minPF'); bindNum('#maxDD','maxDD');

document.querySelectorAll('.sortbtn').forEach((b) => {
  b.addEventListener('click', () => {
    const s = b.dataset.s;
    if (state.sort === s){ state.desc = !state.desc; }
    else { state.sort = s; state.desc = !ASC_IS_BETTER.has(s); }
    document.querySelectorAll('.sortbtn').forEach((o) => {
      const active = o.dataset.s === state.sort;
      o.setAttribute('aria-pressed', String(active));
      o.querySelector('.dir').textContent = active ? (state.desc ? '↓' : '↑') : '';
    });
    apply();
  });
});

$('#reset').addEventListener('click', () => {
  state.q = ''; state.sym = ''; state.tf = ''; state.dir = '';
  state.minT = null; state.minPF = null; state.maxDD = null;
  state.status.clear();
  $('#q').value = ''; $('#sym').value = ''; $('#tf').value = ''; $('#dir').value = '';
  $('#minT').value = ''; $('#minPF').value = ''; $('#maxDD').value = '';
  document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed','false'));
  apply();
});

const dlg = $('#dlg');
const dlgBody = $('#dlgBody');
const dlgTitle = $('#dlgTitle');
const dlgCopy = $('#dlgCopy');
let copyText = '';

list.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const r = DATA.filter((x) => x.id === b.dataset.id)[0];
  if (!r) return;
  if (b.dataset.act === 'pine'){
    dlgTitle.textContent = r.name + ' — Pine v6';
    dlgBody.innerHTML = '<pre>' + esc(r.pineSource) + '</pre>';
    copyText = r.pineSource;
    dlgCopy.hidden = false;
    dlgCopy.textContent = 'Copy';
  } else {
    dlgTitle.textContent = r.name + ' — rules';
    dlgBody.innerHTML = '<div class="prose">' + esc(r.description) +
      (r.specPath ? '<p class="spec-note">Full spec: <code>' + esc(r.specPath) + '</code></p>' : '') +
      (r.notes ? '<p class="spec-note">' + esc(r.notes) + '</p>' : '') + '</div>';
    dlgCopy.hidden = true;
  }
  dlg.showModal();
});

dlgCopy.addEventListener('click', () => {
  navigator.clipboard.writeText(copyText).then(
    () => { dlgCopy.textContent = 'Copied'; },
    () => { dlgCopy.textContent = 'Press Ctrl+C'; }
  );
});
$('#dlgClose').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });

apply();
</script>
