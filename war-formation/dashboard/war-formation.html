    "lastTestedDate": "2026-09-01",
    "description": "Five stacked vetoes on a 1m chart, with 6h/1h/15m/3m rebuilt from bar timestamps. The previous 6h block sets direction by counting green 1h candles (4+ = bull, 2- = bear). No trading in the first or last hour of the 6h block. The current 1h must agree. The level is the previous 15m extreme, which price must first violate. The prior bar must be coiled (atr3 < atr30 x 0.85). Then the 1m must reclaim the level with velocity (>= 0.8x atr30). Oracle overlays: no entries in the whole-number middles (sub 400-600), no longs in the 1-4am ET witching hour. Protective gap stop and target both fixed at entry, never moved.",
    "backtestStart": "2025-12-16",
    "backtestEnd": "2026-05-03",
    "pineSource": "//@version=6\n// THE WAR FORMATION — BTCUSDT, 1m base chart.\n// Cascade: 6h regime -> time gate -> 1h agreement -> 15m level -> 3m coil -> 1m velocity trigger.\n// Higher timeframes are rebuilt from 1m bar timestamps, using only allowlisted builtins.\n// KEPT: five-layer veto cascade, whole-number middles filter, witching-hour long ban,\n//       protective-gap fixed SL/TP set at entry, max-hold flatten.\n// DROPPED: nothing forbidden requested. No trailing stop, no pyramiding, no averaging down.\nstrategy(\"War Formation\", overlay=true,\n     pyramiding=1, process_orders_on_close=true,\n     commission_type=strategy.commission.percent, commission_value=0.05,\n     initial_capital=10000,\n     default_qty_type=strategy.percent_of_equity, default_qty_value=100,\n     margin_long=100, margin_short=100)\n\n// ---------------- inputs ----------------\ngreenBull = input.int(4,     \"Green 1h candles for BULL\")\ngreenBear = input.int(2,     \"Green 1h candles at or below for BEAR\")\nskipOpen  = input.int(60,    \"Skip first N minutes of 6h block\")\nskipClose = input.int(60,    \"Skip last N minutes of 6h block\")\ncoilK     = input.float(0.85,\"3m coil: atr(3) < atr(30) * K\")\nvelK      = input.float(0.8, \"Velocity: min reclaim as multiple of atr(30)\")\nmidLo     = input.float(400, \"Whole-number middles low\")\nmidHi     = input.float(600, \"Whole-number middles high\")\netOffset  = input.int(-4,    \"ET offset from UTC\")\nwitchOn   = input.bool(true, \"Ban longs in witching hour 1-4am ET\")\ngapPct    = input.float(4.0, \"Protective gap % (stop)\")\nrr        = input.float(1.5, \"Reward:risk for take profit\")\nmaxBars   = input.int(1440,  \"Max bars in trade\")\n\n// ---------------- timeframe buckets from 1m timestamps ----------------\nMS6H = 21600000\nMS1H = 3600000\nMS15 = 900000\n\nb6  = math.floor(time / MS6H)\nb1h = math.floor(time / MS1H)\nb15 = math.floor(time / MS15)\n\nnew6  = b6  != b6[1]\nnew1h = b1h != b1h[1]\nnew15 = b15 != b15[1]\n\n// ---------------- LAYER 1: 6h regime from previous block's 1h candles ----------------\nvar float h1o     = na      // open of the 1h candle currently forming\nvar int   grnCur  = 0       // green 1h candles counted inside the current 6h block\nvar int   cntCur  = 0       // completed 1h candles inside the current 6h block\nvar int   grnPrev = 0\nvar int   cntPrev = 0\n\nif new6\n    grnPrev := grnCur\n    cntPrev := cntCur\n    grnCur  := 0\n    cntCur  := 0\n\nif new1h\n    if not na(h1o)\n        cntCur := cntCur + 1\n        if close[1] > h1o\n            grnCur := grnCur + 1\n    h1o := open\n\nregimeReady = cntPrev >= 5\nbullRegime  = regimeReady and grnPrev >= greenBull\nbearRegime  = regimeReady and grnPrev <= greenBear\n\n// ---------------- LAYER 2: time gate inside the 6h block ----------------\nminsIn    = (time - b6 * MS6H) / 60000\ntimeGate  = minsIn >= skipOpen and minsIn <= (360 - skipClose)\n\n// ---------------- LAYER 3: current 1h must agree ----------------\nh1Bull = not na(h1o) and close > h1o\nh1Bear = not na(h1o) and close < h1o\n\n// ---------------- LAYER 4: previous completed 15m extreme ----------------\nvar float c15h = na\nvar float c15l = na\nvar float p15h = na\nvar float p15l = na\n\nif new15\n    p15h := c15h\n    p15l := c15l\n    c15h := high\n    c15l := low\nelse\n    c15h := na(c15h) ? high : math.max(c15h, high)\n    c15l := na(c15l) ? low  : math.min(c15l, low)\n\n// the level must have been violated inside the current 15m candle before it can be reclaimed\nbrokeBelow = not na(p15l) and c15l < p15l\nbrokeAbove = not na(p15h) and c15h > p15h\n\n// ---------------- LAYER 5: 3m coil ----------------\natrFast = ta.atr(3)\natrSlow = ta.atr(30)\ncoiled  = not na(atrSlow) and atrSlow > 0 and atrFast < atrSlow * coilK\n// The coil must precede the thrust. A bar cannot be compressed AND expanding at once,\n// so the compression is read on the PRIOR bar and the trigger fires on this one.\ncoilPrev = coiled[1]\nvelMin   = na(atrSlow) ? na : atrSlow * velK\n\n// ---------------- Oracle overlays ----------------\nsub      = close - math.floor(close / 1000) * 1000\ninMiddle = sub >= midLo and sub <= midHi\n\nhUTC     = math.floor(time / MS1H) % 24\nhET      = (hUTC + etOffset + 24) % 24\nwitching = hET >= 1 and hET < 4\nlongBan  = witchOn and witching\n\n// ---------------- TRIGGER: 1m reclaim with velocity ----------------\nlongTrig  = not na(p15l) and not na(velMin) and ta.crossover(close, p15l)  and (close - p15l) >= velMin\nshortTrig = not na(p15h) and not na(velMin) and ta.crossunder(close, p15h) and (p15h - close) >= velMin\n\ngoLong  = bullRegime and timeGate and h1Bull and brokeBelow and coilPrev and not inMiddle and not longBan and longTrig\ngoShort = bearRegime and timeGate and h1Bear and brokeAbove and coilPrev and not inMiddle and shortTrig\n\n// ---------------- state ----------------\nvar float slPx   = na\nvar float tpPx   = na\nvar int   barsIn = 0\n\nflat = strategy.position_size == 0\n\n// ---------------- entries: protective gap fixed at the moment of entry ----------------\nif flat and goLong\n    strategy.entry(\"L\", strategy.long)\n    slPx   := close * (1 - gapPct / 100)\n    tpPx   := close * (1 + gapPct * rr / 100)\n    barsIn := 0\nelse if flat and goShort\n    strategy.entry(\"S\", strategy.short)\n    slPx   := close * (1 + gapPct / 100)\n    tpPx   := close * (1 - gapPct * rr / 100)\n    barsIn := 0\n\n// ---------------- exits: same prices every bar, never moved ----------------\nif strategy.position_size > 0\n    strategy.exit(\"LX\", from_entry=\"L\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\nif strategy.position_size < 0\n    strategy.exit(\"SX\", from_entry=\"S\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\n\nif barsIn >= maxBars and strategy.position_size != 0\n    strategy.close_all()\n    barsIn := 0\n\n// ---------------- diagnostics ----------------\nplot(grnPrev,                     title=\"Green1hPrev6h\")\nplot(bullRegime ? 1 : bearRegime ? -1 : 0, title=\"Regime\")\nplot(coilPrev ? 1 : 0,            title=\"CoiledPrev\")\nplot(velMin,                      title=\"VelMin\")\nplot(inMiddle ? 1 : 0,            title=\"InMiddles\")\nplot(witching ? 1 : 0,            title=\"WitchingHour\")\nplot(hET,                         title=\"HourET\")\n",

5[1]\n\n// ---------------- LAYER 1: 6h regime from previous block's 1h candles ----------------\nvar float h1o     = na      // open of the 1h candle currently forming\nvar int   grnCur  = 0       // green 1h candles counted inside the current 6h block\nvar int   cntCur  = 0       // completed 1h candles inside the current 6h block\nvar int   grnPrev = 0\nvar int   cntPrev = 0\n\nif new6\n    grnPrev := grnCur\n    cntPrev := cntCur\n    grnCur  := 0\n    cntCur  := 0\n\nif new1h\n    if not na(h1o)\n        cntCur := cntCur + 1\n        if close[1] > h1o\n            grnCur := grnCur + 1\n    h1o := open\n\nregimeReady = cntPrev >= 5\nbullRegime  = regimeReady and grnPrev >= greenBull\nbearRegime  = regimeReady and grnPrev <= greenBear\n\n// ---------------- LAYER 2: time gate inside the 6h block ----------------\nminsIn    = (time - b6 * MS6H) / 60000\ntimeGate  = minsIn >= skipOpen and minsIn <= (360 - skipClose)\n\n// ---------------- LAYER 3: current 1h must agree ----------------\nh1Bull = not na(h1o) and close > h1o\nh1Bear = not na(h1o) and close < h1o\n\n// ---------------- LAYER 4: previous completed 15m extreme ----------------\nvar float c15h = na\nvar float c15l = na\nvar float p15h = na\nvar float p15l = na\n\nif new15\n    p15h := c15h\n    p15l := c15l\n    c15h := high\n    c15l := low\nelse\n    c15h := na(c15h) ? high : math.max(c15h, high)\n    c15l := na(c15l) ? low  : math.min(c15l, low)\n\n// the level must have been violated inside the current 15m candle before it can be reclaimed\nbrokeBelow = not na(p15l) and c15l < p15l\nbrokeAbove = not na(p15h) and c15h > p15h\n\n// ---------------- LAYER 5: 3m coil ----------------\natrFast = ta.atr(3)\natrSlow = ta.atr(30)\ncoiled  = not na(atrSlow) and atrSlow > 0 and atrFast < atrSlow * coilK\n// The coil must precede the thrust. A bar cannot be compressed AND expanding at once,\n// so the compression is read on the PRIOR bar and the trigger fires on this one.\ncoilPrev = coiled[1]\nvelMin   = na(atrSlow) ? na : atrSlow * velK\n\n// ---------------- Oracle overlays ----------------\nsub      = close - math.floor(close / 1000) * 1000\ninMiddle = sub >= midLo and sub <= midHi\n\nhUTC     = math.floor(time / MS1H) % 24\nhET      = (hUTC + etOffset + 24) % 24\nwitching = hET >= 1 and hET < 4\nlongBan  = witchOn and witching\n\n// ---------------- TRIGGER: 1m reclaim with velocity ----------------\nlongTrig  = not na(p15l) and not na(velMin) and ta.crossover(close, p15l)  and (close - p15l) >= velMin\nshortTrig = not na(p15h) and not na(velMin) and ta.crossunder(close, p15h) and (p15h - close) >= velMin\n\ngoLong  = bullRegime and timeGate and h1Bull and brokeBelow and coilPrev and not inMiddle and not longBan and longTrig\ngoShort = bearRegime and timeGate and h1Bear and brokeAbove and coilPrev and not inMiddle and shortTrig\n\n// ---------------- state ----------------\nvar float slPx   = na\nvar float tpPx   = na\nvar int   barsIn = 0\n\nflat = strategy.position_size == 0\n\n// ---------------- entries: protective gap fixed at the moment of entry ----------------\nif flat and goLong\n    strategy.entry(\"L\", strategy.long)\n    slPx   := close * (1 - gapPct / 100)\n    tpPx   := close * (1 + gapPct * rr / 100)\n    barsIn := 0\nelse if flat and goShort\n    strategy.entry(\"S\", strategy.short)\n    slPx   := close * (1 + gapPct / 100)\n    tpPx   := close * (1 - gapPct * rr / 100)\n    barsIn := 0\n\n// ---------------- exits: same prices every bar, never moved ----------------\nif strategy.position_size > 0\n    strategy.exit(\"LX\", from_entry=\"L\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\nif strategy.position_size < 0\n    strategy.exit(\"SX\", from_entry=\"S\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\n\nif barsIn >= maxBars and strategy.position_size != 0\n    strategy.close_all()\n    barsIn := 0\n\n// ---------------- diagnostics ----------------\nplot(grnPrev,                     title=\"Green1hPrev6h\")\nplot(bullRegime ? 1 : bearReg aC < liveHaO\n\n// ---------------- LAYER 4: previous completed 15m extreme (REAL prices - these are fill levels) ----------------\nvar float c15h = na\nvar float c15l = na\nvar float p15h = na\nvar float p15l = na\n\nif new15\n    p15h := c15h\n    p15l := c15l\n    c15h := high\n    c15l := low\nelse\n    c15h := na(c15h) ? high : math.max(c15h, high)\n    c15l := na(c15l) ? low  : math.min(c15l, low)\n\nbrokeBelow = not na(p15l) and c15l < p15l\nbrokeAbove = not na(p15h) and c15h > p15h\n\n// ---------------- LAYER 5: 3m coil, read on the PRIOR bar ----------------\natrFast  = ta.atr(3)\natrSlow  = ta.atr(30)\ncoiled   = not na(atrSlow) and atrSlow > 0 and atrFast < atrSlow * coilK\ncoilPrev = coiled[1]\nvelMin   = na(atrSlow) ? na : atrSlow * velK\n\n// ---------------- Oracle overlays ----------------\nsub      = close - math.floor(close / 1000) * 1000\ninMiddle = sub >= midLo and sub <= midHi\n\nhUTC     = math.floor(time / MS1H) % 24\nhET      = (hUTC + etOffset + 24) % 24\nwitching = hET >= 1 and hET < 4\nlongBan  = witchOn and witching\n\n// ---------------- TRIGGER: 1m reclaim, with velocity, on a turning HA candle ----------------\nlongTrig  = not na(p15l) and not na(velMin) and ta.crossover(close, p15l)  and (close - p15l) >= velMin and haUp\nshortTrig = not na(p15h) and not na(velMin) and ta.crossunder(close, p15h) and (p15h - close) >= velMin and haDn\n\ngoLong  = bullRegime and timeGate and h1Bull and brokeBelow and coilPrev and not inMiddle and not longBan and longTrig\ngoShort = bearRegime and timeGate and h1Bear and brokeAbove and coilPrev and not inMiddle and shortTrig\n\n// ---------------- structural risk: stop beyond the level that was swept ----------------\nminR = close * minRpct / 100\nmaxR = close * maxRpct / 100\nbuf  = na(atrSlow) ? 0.0 : atrSlow * bufK\n\nrawLongR  = na(c15l) ? na : close - (c15l - buf)\nrawShortR = na(c15h) ? na : (c15h + buf) - close\nlongR     = na(rawLongR)  ? na : math.min(math.max(rawLongR,  minR), maxR)\nshortR aC < liveHaO\n\n// ---------------- LAYER 4: previous completed 15m extreme (REAL prices - these are fill levels) ----------------\nvar float c15h = na\nvar float c15l = na\nvar float p15h = na\nvar float p15l = na\n\nif new15\n    p15h := c15h\n    p15l := c15l\n    c15h := high\n    c15l := low\nelse\n    c15h := na(c15h) ? high : math.max(c15h, high)\n    c15l := na(c15l) ? low  : math.min(c15l, low)\n\nbrokeBelow = not na(p15l) and c15l < p15l\nbrokeAbove = not na(p15h) and c15h > p15h\n\n// ---------------- LAYER 5: 3m coil, read on the PRIOR bar ----------------\natrFast  = ta.atr(3)\natrSlow  = ta.atr(30)\ncoiled   = not na(atrSlow) and atrSlow > 0 and atrFast < atrSlow * coilK\ncoilPrev = coiled[1]\nvelMin   = na(atrSlow) ? na : atrSlow * velK\n\n// ---------------- Oracle overlays ----------------\nsub      = close - math.floor(close / 1000) * 1000\ninMiddle = sub >= midLo and sub <= midHi\n\nhUTC     = math.floor(time / MS1H) % 24\nhET      = (hUTC + etOffset + 24) % 24\nwitching = hET >= 1 and hET < 4\nlongBan  = witchOn and witching\n\n// ---------------- TRIGGER: 1m reclaim, with velocity, on a turning HA candle ----------------\nlongTrig  = not na(p15l) and not na(velMin) and ta.crossover(close, p15l)  and (close - p15l) >= velMin and haUp\nshortTrig = not na(p15h) and not na(velMin) and ta.crossunder(close, p15h) and (p15h - close) >= velMin and haDn\n\ngoLong  = bullRegime and timeGate and h1Bull and brokeBelow and coilPrev and not inMiddle and not longBan and longTrig\ngoShort = bearRegime and timeGate and h1Bear and brokeAbove and coilPrev and not inMiddle and shortTrig\n\n// ---------------- structural risk: stop beyond the level that was swept ----------------\nminR = close * minRpct / 100\nmaxR = close * maxRpct / 100\nbuf  = na(atrSlow) ? 0.0 : atrSlow * bufK\n\nrawLongR  = na(c15l) ? na : close - (c15l - buf)\nrawShortR = na(c15h) ? na : (c15h + buf) - close\nlongR     = na(rawLongR)  ? na : math.min(math.max(rawLongR,  minR), maxR)\nshortR    = na(rawShortR) ? na : math.min(math.max(rawShortR, minR), maxR)\n\nvar float slPx   = na\nvar float tpPx   = na\nvar int   barsIn = 0\n\nflat = strategy.position_size == 0\n\nif flat and goLong and not na(longR) and longR > 0\n    strategy.entry(\"L\", strategy.long)\n    slPx   := close - longR\n    tpPx   := close + longR * rr\n    barsIn := 0\nelse if flat and goShort and not na(shortR) and shortR > 0\n    strategy.entry(\"S\", strategy.short)\n    slPx   := close + shortR\n    tpPx   := close - shortR * rr\n    barsIn := 0\n\nif strategy.position_size > 0\n    strategy.exit(\"LX\", from_entry=\"L\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\nif strategy.position_size < 0\n    strategy.exit(\"SX\", from_entry=\"S\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\n\nif barsIn >= maxBars and strategy.position_size != 0\n    strategy.close_all()\n    barsIn := 0\n\nplot(grnPrev,                              title=\"GreenHA1hPrev6h\")\nplot(bullRegime ? 1 : bearRegime ? -1 : 0, title=\"Regime\")\nplot(haUp ? 1 : haDn ? -1 : 0,             title=\"HA1mColour\")\nplot(coilPrev ? 1 : 0,                     title=\"CoiledPrev\")\nplot(inMiddle ? 1 : 0,                     title=\"InMiddles\")\nplot(hET,                                  title=\"HourET\")\n",

aC < liveHaO\n\n// ---------------- LAYER 4: previous completed 15m extreme (REAL prices - these are fill levels) ----------------\nvar float c15h = na\nvar float c15l = na\nvar float p15h = na\nvar float p15l = na\n\nif new15\n    p15h := c15h\n    p15l := c15l\n    c15h := high\n    c15l := low\nelse\n    c15h := na(c15h) ? high : math.max(c15h, high)\n    c15l := na(c15l) ? low  : math.min(c15l, low)\n\nbrokeBelow = not na(p15l) and c15l < p15l\nbrokeAbove = not na(p15h) and c15h > p15h\n\n// ---------------- LAYER 5: 3m coil, read on the PRIOR bar ----------------\natrFast  = ta.atr(3)\natrSlow  = ta.atr(30)\ncoiled   = not na(atrSlow) and atrSlow > 0 and atrFast < atrSlow * coilK\ncoilPrev = coiled[1]\nvelMin   = na(atrSlow) ? na : atrSlow * velK\n\n// ---------------- Oracle overlays ----------------\nsub      = close - math.floor(close / 1000) * 1000\ninMiddle = sub >= midLo and sub <= midHi\n\nhUTC     = math.floor(time / MS1H) % 24\nhET      = (hUTC + etOffset + 24) % 24\nwitching = hET >= 1 and hET < 4\nlongBan  = witchOn and witching\n\n// ---------------- TRIGGER: 1m reclaim, with velocity, on a turning HA candle ----------------\nlongTrig  = not na(p15l) and not na(velMin) and ta.crossover(close, p15l)  and (close - p15l) >= velMin and haUp\nshortTrig = not na(p15h) and not na(velMin) and ta.crossunder(close, p15h) and (p15h - close) >= velMin and haDn\n\ngoLong  = bullRegime and timeGate and h1Bull and brokeBelow and coilPrev and not inMiddle and not longBan and longTrig\ngoShort = bearRegime and timeGate and h1Bear and brokeAbove and coilPrev and not inMiddle and shortTrig\n\n// ---------------- structural risk: stop beyond the level that was swept ----------------\nminR = close * minRpct / 100\nmaxR = close * maxRpct / 100\nbuf  = na(atrSlow) ? 0.0 : atrSlow * bufK\n\nrawLongR  = na(c15l) ? na : close - (c15l - buf)\nrawShortR = na(c15h) ? na : (c15h + buf) - close\nlongR     = na(rawLongR)  ? na : math.min(math.max(rawLongR,  minR), maxR)\nshortR    = na(rawShortR) ? na : math.min(math.max(rawShortR, minR), maxR)\n\nvar float slPx   = na\nvar float tpPx   = na\nvar int   barsIn = 0\n\nflat = strategy.position_size == 0\n\nif flat and goLong and not na(longR) and longR > 0\n    strategy.entry(\"L\", strategy.long)\n    slPx   := close - longR\n    tpPx   := close + longR * rr\n    barsIn := 0\nelse if flat and goShort and not na(shortR) and shortR > 0\n    strategy.entry(\"S\", strategy.short)\n    slPx   := close + shortR\n    tpPx   := close - shortR * rr\n    barsIn := 0\n\nif strategy.position_size > 0\n    strategy.exit(\"LX\", from_entry=\"L\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\nif strategy.position_size < 0\n    strategy.exit(\"SX\", from_entry=\"S\", stop=slPx, limit=tpPx)\n    barsIn := barsIn + 1\n\nif barsIn >= maxBars and strategy.position_size != 0\n    strategy.close_all()\n    barsIn := 0\n\nplot(grnPrev,                              title=\"GreenHA1hPrev6h\")\nplot(bullRegime ? 1 : bearRegime ? -1 : 0, title=\"Regime\")\nplot(haUp ? 1 : haDn ? -1 : 0,             title=\"HA1mColour\")\nplot(coilPrev ? 1 : 0,                     title=\"CoiledPrev\")\nplot(inMiddle ? 1 : 0,                     title=\"InMiddles\")\nplot(hET,                                  title=\"HourET\")\n",

const BUILT = "2026-09-02 04:47";

const $ = (s) => document.querySelector(s);
const list = $('#list');
$('#stamp').textContent = DATA.length
  ? DATA.length + ' backtested · built ' + BUILT
  : 'No backtests yet · built ' + BUILT;

const state = {
  q:'', status:new Set(), sym:'', tf:'', dir:'',
  minT:null, minPF:null, maxDD:null, sort:'profitFactor', desc:true
};
// Drawdown is the one axis where lower is better, so it defaults to ascending.
const ASC_IS_BETTER = new Set(['maxDrawdownPct']);

const ENT = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ENT[c]);
const n1 = (v) => v.toFixed(1);
const n2 = (v) => v.toFixed(2);
const sign = (v) => (v > 0 ? '+' : '') + n1(v) + '%';

function fillSelect(el, vals){
  vals.forEach((v) => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v; el.appendChild(o);
  });
}
fillSelect($('#sym'), [...new Set(DATA.map((d) => d.symbol))].sort());
fillSelect($('#tf'),  [...new Set(DATA.map((d) => d.timeframe))].sort());
fillSelect($('#dir'), [...new Set(DATA.map((d) => d.direction))].sort());

function summary(rows){
  let cells;
  if (!DATA.length){
    cells = [['Strategies backtested','0'],['Passed','0'],['Best profit factor','—'],
             ['Lowest max DD','—'],['Total trades','—']];
  } else {
    const pf = rows.map((r) => r.metrics.profitFactor);
    const dd = rows.map((r) => r.metrics.maxDrawdownPct);
    cells = [
      ['Strategies backtested', String(DATA.length)],
      ['Passed', String(DATA.filter((r) => r.status === 'passed').length)],
      ['Best profit factor', pf.length ? n2(Math.max.apply(null, pf)) : '—'],
      ['Lowest max DD', dd.length ? n1(Math.min.apply(null, dd)) + '%' : '—'],
      ['Total trades', String(rows.reduce((a, r) => a + r.metrics.totalTrades, 0))]
    ];
  }
  $('#strip').innerHTML = cells.map(
    (c) => '<div class="cell"><div class="k">' + esc(c[0]) + '</div><div class="v">' + esc(c[1]) + '</div></div>'
  ).join('');
}

function apply(){
  const rows = DATA.filter((r) => {
    if (state.status.size && !state.status.has(r.status)) return false;
    if (state.sym && r.symbol !== state.sym) return false;
    if (state.tf && r.timeframe !== state.tf) return false;
    if (state.dir && r.direction !== state.dir) return false;
    if (state.minT !== null && r.metrics.totalTrades < state.minT) return false;
    if (state.minPF !== null && r.metrics.profitFactor < state.minPF) return false;
    if (state.maxDD !== null && r.metrics.maxDrawdownPct > state.maxDD) return false;
    if (state.q){
      const hay = (r.name + ' ' + r.description + ' ' + r.symbol).toLowerCase();
      if (hay.indexOf(state.q.toLowerCase()) === -1) return false;
    }
    return true;
  });
  const k = state.sort;
  rows.sort((a, b) => {
    const av = k === 'lastTestedDate' ? a[k] : a.metrics[k];
    const bv = k === 'lastTestedDate' ? b[k] : b.metrics[k];
    const c = av < bv ? -1 : av > bv ? 1 : 0;
    return state.desc ? -c : c;
  });
  summary(rows);
  $('#count').textContent = DATA.length ? rows.length + ' of ' + DATA.length : '';
  render(rows);
}

function metric(k, v, cls){
  return '<div class="m"><div class="k">' + k + '</div><div class="v ' + (cls || '') + '">' + v + '</div></div>';
}

function render(rows){
  if (!DATA.length){ list.innerHTML = emptyState(); return; }
  if (!rows.length){
    list.innerHTML = '<div class="empty"><h3>No strategies match these filters</h3>' +
      '<p>Loosen a threshold or clear the filters to see the full set.</p></div>';
    return;
  }
  list.innerHTML = rows.map((r) => {
    const m = r.metrics;
    const full = (r.provenance && r.provenance.backtestUrl)
      ? '<a class="btn primary" href="' + esc(r.provenance.backtestUrl) + '" target="_blank" rel="noopener">Full backtest</a>'
      : '<button class="btn primary" disabled>Full backtest</button>';
    return '<article class="row" data-status="' + esc(r.status) + '"><div class="stripe"></div><div class="row-in">' +
      '<div class="row-head"><h2>' + esc(r.name) + '</h2>' +
        '<span class="pill ' + esc(r.status) + '">' + esc(r.status) + '</span>' +
        '<span class="tag">' + esc(r.symbol) + '</span>' +
        '<span class="tag">' + esc(r.timeframe) + '</span>' +
        '<span class="tag">' + esc(r.direction) + '</span></div>' +
      '<p class="desc">' + esc(r.description) + '</p>' +
      '<div class="metrics">' +
        metric('Net return', sign(m.netProfitPct), m.netProfitPct >= 0 ? 'pos' : 'neg') +
        metric('Profit factor', n2(m.profitFactor), m.profitFactor >= 1 ? 'pos' : 'neg') +
        metric('Max drawdown', n1(m.maxDrawdownPct) + '%') +
        metric('Trades', String(m.totalTrades)) +
        metric('Win rate', n1(m.winRatePct) + '%') +
        metric('Avg trade', sign(m.avgTradePct), m.avgTradePct >= 0 ? 'pos' : 'neg') +
      '</div>' +
      '<div class="row-foot"><div class="dates">' +
        '<span>Tested ' + esc(r.backtestStart) + ' → ' + esc(r.backtestEnd) + '</span>' +
        '<span>Created ' + esc(r.createdDate) + '</span>' +
        '<span>Last tested ' + esc(r.lastTestedDate) + '</span></div>' +
      '<div class="acts">' +
        '<button class="btn" data-act="rules" data-id="' + esc(r.id) + '">Rules</button>' +
        '<button class="btn" data-act="pine" data-id="' + esc(r.id) + '"' + (r.pineSource ? '' : ' disabled') + '>Pine script</button>' +
        full +
      '</div></div></div></article>';
  }).join('');
}

function emptyState(){
  return '<div class="empty">' +
    '<h3>Nothing has been backtested yet</h3>' +
    '<p>This panel only ever shows strategies with a recorded backtest behind them. Specifications that ' +
    'have not been run do not appear here.</p>' +
    '<ol>' +
      '<li>Code the strategy as Pine v6 and run a real backtest.</li>' +
      '<li>Read the metrics off the returned report.</li>' +
      '<li>Append a record to <code>results/backtests.json</code>.</li>' +
      '<li>Run <code>python build_dashboard.py</code>.</li>' +
      '<li>Republish <code>dashboard/dashboard.html</code> to this same URL.</li>' +
    '</ol>' +
    '<div class="gate"><b>Build-time gate.</b> The generator rejects any record without a ' +
    '<code>provenance</code> block naming a real backtest job or report URL, and any record whose trade ' +
    'count is zero. Estimated or invented numbers cannot reach this page &mdash; the build fails instead.</div>' +
  '</div>';
}

$('#q').addEventListener('input', (e) => { state.q = e.target.value.trim(); apply(); });

document.querySelectorAll('.chip').forEach((b) => {
  b.addEventListener('click', () => {
    const v = b.dataset.v;
    const on = b.getAttribute('aria-pressed') === 'true';
    b.setAttribute('aria-pressed', String(!on));
    if (on) state.status.delete(v); else state.status.add(v);
    apply();
  });
});

function bindSel(id, key){
  $(id).addEventListener('change', (e) => { state[key] = e.target.value; apply(); });
}
bindSel('#sym','sym'); bindSel('#tf','tf'); bindSel('#dir','dir');

function bindNum(id, key){
  $(id).addEventListener('input', (e) => {
    const v = e.target.value;
    state[key] = v === '' ? null : Number(v);
    apply();
  });
}
bindNum('#minT','minT'); bindNum('#minPF','minPF'); bindNum('#maxDD','maxDD');

document.querySelectorAll('.sortbtn').forEach((b) => {
  b.addEventListener('click', () => {
    const s = b.dataset.s;
    if (state.sort === s){ state.desc = !state.desc; }
    else { state.sort = s; state.desc = !ASC_IS_BETTER.has(s); }
    document.querySelectorAll('.sortbtn').forEach((o) => {
      const active = o.dataset.s === state.sort;
      o.setAttribute('aria-pressed', String(active));
      o.querySelector('.dir').textContent = active ? (state.desc ? '↓' : '↑') : '';
    });
    apply();
  });
});

$('#reset').addEventListener('click', () => {
  state.q = ''; state.sym = ''; state.tf = ''; state.dir = '';
  state.minT = null; state.minPF = null; state.maxDD = null;
  state.status.clear();
  $('#q').value = ''; $('#sym').value = ''; $('#tf').value = ''; $('#dir').value = '';
  $('#minT').value = ''; $('#minPF').value = ''; $('#maxDD').value = '';
  document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed','false'));
  apply();
});

const dlg = $('#dlg');
const dlgBody = $('#dlgBody');
const dlgTitle = $('#dlgTitle');
const dlgCopy = $('#dlgCopy');
let copyText = '';

list.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const r = DATA.filter((x) => x.id === b.dataset.id)[0];
  if (!r) return;
  if (b.dataset.act === 'pine'){
    dlgTitle.textContent = r.name + ' — Pine v6';
    dlgBody.innerHTML = '<pre>' + esc(r.pineSource) + '</pre>';
    copyText = r.pineSource;
    dlgCopy.hidden = false;
    dlgCopy.textContent = 'Copy';
  } else {
    dlgTitle.textContent = r.name + ' — rules';
    dlgBody.innerHTML = '<div class="prose">' + esc(r.description) +
      (r.specPath ? '<p class="spec-note">Full spec: <code>' + esc(r.specPath) + '</code></p>' : '') +
      (r.notes ? '<p class="spec-note">' + esc(r.notes) + '</p>' : '') + '</div>';
    dlgCopy.hidden = true;
  }
  dlg.showModal();
});

dlgCopy.addEventListener('click', () => {
  navigator.clipboard.writeText(copyText).then(
    () => { dlgCopy.textContent = 'Copied'; },
    () => { dlgCopy.textContent = 'Press Ctrl+C'; }
  );
});
$('#dlgClose').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });

apply();
</script>
